          const net = getNet();
          const defs = [
            { name: 'SA1 cpu/alu/adder/bit2', type: 'stuck1', gateId: findGateByBlock(net, 'cpu/alu/adder/bit2', 0) },
            { name: 'SA1 cpu/pc/inc/bit1', type: 'stuck1', gateId: findGateByBlock(net, 'cpu/pc/inc/bit1', 0) },
            { name: 'SA1 cpu/sequencer', type: 'stuck1', gateId: findGateByBlock(net, 'cpu/sequencer', 5) },
            { name: 'SA1 cpu/regfile/r2', type: 'stuck1', gateId: findGateByBlock(net, 'cpu/regfile/r2', 0) },
            { name: 'SA1 cpu/alu/out_mux', type: 'stuck1', gateId: findGateByBlock(net, 'cpu/alu/out_mux', 0) },
            { name: 'SA1 cpu/ir', type: 'stuck1', gateId: findGateByBlock(net, 'cpu/ir', 3) }
          ];
          const res = runFaultBatch(defs);
          return { pass: res.length === 6, metrics: { faults: res, caught: res.filter(x => x.caught).length } };
        }
      },
      {
        id: 36, name: 'Burnt Edges: Swapped Inputs & Inverted Outputs (4 faults)',
        inputTag: 'burnt_edges_swap_inv_4',
        run() {
          const net = getNet();
          const defs = [
            { name: 'SWAP alu/adder bit0 & bit1', type: 'swap_inputs', gateId: findGateByBlock(net, 'cpu/alu/adder/bit0', 0), gateId2: findGateByBlock(net, 'cpu/alu/adder/bit1', 0) },
            { name: 'SWAP bus/addr_mux bit0 & bit1', type: 'swap_inputs', gateId: findGateByBlock(net, 'cpu/bus/addr_mux', 0), gateId2: findGateByBlock(net, 'cpu/bus/addr_mux', 3) },
            { name: 'INV alu/adder/bit1 sum', type: 'invert_out', gateId: findGateByBlock(net, 'cpu/alu/adder/bit1', 7) },
            { name: 'INV pc/inc/bit0 sum', type: 'invert_out', gateId: findGateByBlock(net, 'cpu/pc/inc/bit0', 3) }
          ];
          const res = runFaultBatch(defs);
          return { pass: res.length === 4, metrics: { faults: res, caught: res.filter(x => x.caught).length } };
        }
      },
      {
        id: 37, name: 'Burnt Edges: Missing Adder Carry & Stuck PC Bits (4 faults)',
        inputTag: 'burnt_edges_carry_pc_4',
        run() {
          const net = getNet();
          const defs = [
            { name: 'MISSING_CARRY adder/bit3/carry', type: 'stuck0', gateId: findGateByBlock(net, 'cpu/alu/adder/bit3/carry', 0) },
            { name: 'MISSING_CARRY adder/bit7/carry', type: 'stuck0', gateId: findGateByBlock(net, 'cpu/alu/adder/bit7/carry', 0) },
            { name: 'STUCK_PC bit0', type: 'stuck0', gateId: findGateByBlock(net, 'cpu/pc', 5) },
            { name: 'STUCK_PC bit4', type: 'stuck1', gateId: findGateByBlock(net, 'cpu/pc', 55) }
          ];
          const res = runFaultBatch(defs);
          return { pass: res.length === 4, metrics: { faults: res, caught: res.filter(x => x.caught).length } };
        }
      },
      {
        id: 38, name: 'Burnt Edges: Unclocked Flip-Flops & Swapped Regfile Read-Mux (4 faults)',
        inputTag: 'burnt_edges_ff_regmux_4',
        run() {
          const net = getNet();
          const pcFF = net.flipFlops.findIndex(f => f.name === 'pc_0');
          const r1FF = net.flipFlops.findIndex(f => f.name === 'r1_0');
          const defs = [
            { name: 'UNCLOCKED_FF pc_0', type: 'unclock_ff', ffIndex: pcFF },
            { name: 'UNCLOCKED_FF r1_0', type: 'unclock_ff', ffIndex: r1FF },
            { name: 'SWAP regfile/read_a mux inputs', type: 'swap_inputs', gateId: findGateByBlock(net, 'cpu/regfile/read_a', 0), gateId2: findGateByBlock(net, 'cpu/regfile/read_a', 3) },
            { name: 'SWAP regfile/read_b mux inputs', type: 'swap_inputs', gateId: findGateByBlock(net, 'cpu/regfile/read_b', 0), gateId2: findGateByBlock(net, 'cpu/regfile/read_b', 3) }
          ];
          const res = runFaultBatch(defs);
          return { pass: res.length === 4, metrics: { faults: res, caught: res.filter(x => x.caught).length } };
        }
      },
      {
        id: 39, name: 'Burnt Edges: Control Faults (2 Unreachable/Invisible)',
        inputTag: 'burnt_edges_control_2',
        run() {
          const defs = [
            { name: 'CONTROL_INVISIBLE unreachable gate SA0', type: 'control_unreachable', stuckVal: 0 },
            { name: 'CONTROL_INVISIBLE unreachable gate SA1', type: 'control_unreachable', stuckVal: 1 }
          ];
          const res = runFaultBatch(defs);
          // BOTH control faults MUST NOT be caught!
          const pass = res.length === 2 && res[0].caught === false && res[1].caught === false;
          return { pass, metrics: { faults: res, correctlyUncaught: res.filter(x => !x.caught).length } };
        }
      },
      {
        id: 40, name: 'Static Scan: Studio Rules (No Network, Eval, Function, innerHTML)',
        inputTag: 'static_scan_studio_rules',
        run() {
          const html = options.getHtmlSource ? options.getHtmlSource() : '';
          if (!html) return { pass: false, metrics: { err: 'HTML source not provided' } };
          // Strip JS line/block comments and HTML comments before scanning for external URLs
          const noComments = html
            .replace(/<!--[\s\S]*?-->/g, '')
            .replace(/\/\*[\s\S]*?\*\//g, '')
            .replace(/(^|[^:])\/\/[^\n]*/g, '$1');
          // Build patterns without embedding literal forbidden tokens
          const patFetch = new RegExp('\\b' + 'fet' + 'ch\\s*\\(');
          const patXhr = new RegExp('\\bXMLHttp' + 'Request\\b');
          const patWs = new RegExp('\\bWeb' + 'Socket\\b');
          const patEval = new RegExp('\\b' + 'ev' + 'al\\s*\\(');
          const patFn = new RegExp('\\bnew\\s+' + 'Func' + 'tion\\b');
          const patInner = new RegExp('\\.' + 'inner' + 'HTML\\b');
          const patUrl = new RegExp('ht' + 'tps?:\\/\\/');

          const findings = {
            fetch: patFetch.test(noComments),
            xhr: patXhr.test(noComments),
            ws: patWs.test(noComments),
            evalCall: patEval.test(noComments),
            newFunction: patFn.test(noComments),
            innerHtml: patInner.test(noComments),
            externalUrl: patUrl.test(noComments)
          };
          const pass = !Object.values(findings).some(Boolean);
          return { pass, metrics: findings };
        }
      },
      {
        id: 41, name: 'Static Scan: No Shipped Fault Switches or Mutant Backdoors',
        inputTag: 'static_scan_no_backdoors',
        run() {
          const prodSrc = [
            deps.Batter.CircuitBuilder.toString(),
            deps.Batter.buildCPU.toString(),
            deps.Griddle.GateSimulator.toString(),
            deps.Griddle.MemoryBus.toString(),
            deps.Pan.BehaviouralCPU.toString()
          ].join('\n');
          const patMutant = /\bfaultSwitch\b|\bmutantMode\b|\binjectFault\b|\bdebugBackdoor\b|\bcheatHash\b/i;
          const hasBackdoor = patMutant.test(prodSrc);
          return { pass: !hasBackdoor, metrics: { hasBackdoor } };
        }
      },
      {
        id: 42, name: 'Reproducibility Check (Constant Seeds & Identical Hashes)',
        inputTag: 'reproducibility_x2',
        run() {
          const n1 = deps.Batter.buildCPU(deps.Utils);
          const n2 = deps.Batter.buildCPU(deps.Utils);
          const p1 = new deps.Pan.BehaviouralCPU();
          const p2 = new deps.Pan.BehaviouralCPU();
          const g = getGame();
          runDemoFramesSingle(p1, g.words, deps.Game.DEMO_TAPE, 600, deps.Game.VAR_FRAME);
          runDemoFramesSingle(p2, g.words, deps.Game.DEMO_TAPE, 600, deps.Game.VAR_FRAME);
          const pass = n1.report.sha256 === n2.report.sha256 &&
                       p1.videoHash() === p2.videoHash() &&
                       p1.writeHash === p2.writeHash;
          return {
            pass,
            metrics: {
              netlistSha: n1.report.sha256.slice(0, 16),
              videoHash: deps.Utils.hex32(p1.videoHash()),
              writeHash: deps.Utils.hex32(p1.writeHash)
            }
          };
        }
      }
    );

    return { suites, ctx };
  }

  return { buildSuites, cloneNetlist, injectFault, runDemoFramesSingle, runDemoLockstep };
})();

</script>

<script id="ui-module">
// ui.js — Interactive DOM-builder UI for FLAPJACK (zero innerHTML, zero autoplay, zero libraries)
const FlapjackUI = (() => {
  function el(tag, attrs, children) {
    const node = document.createElement(tag);
    if (attrs) {
      for (const k in attrs) {
        if (!Object.prototype.hasOwnProperty.call(attrs, k)) continue;
        const v = attrs[k];
        if (k === 'class') node.className = v;
        else if (k === 'text') node.textContent = v;
        else if (k.startsWith('on') && typeof v === 'function') node.addEventListener(k.slice(2).toLowerCase(), v);
        else node.setAttribute(k, v);
      }
    }
    if (children) {
      for (let i = 0; i < children.length; i++) {
        const c = children[i];
        if (c === null || c === undefined) continue;
        node.appendChild(typeof c === 'string' ? document.createTextNode(c) : c);
      }
    }
    return node;
  }

  function clearNode(node) {
    while (node.firstChild) node.removeChild(node.firstChild);
  }

  function init() {
    if (typeof document === 'undefined') return;
    const root = document.getElementById('app');
    if (!root) return;

    // Build deterministic CPU netlist (75ms; CPU stays idle until user acts)
    const netlist = Batter.buildCPU(FlapjackUtils);
    const gameAsm = Whisk.assemble(PancakeGame.PANCAKE_ASM);

    const griddle = new Griddle.GateSimulator(netlist, FlapjackUtils);
    const pan = new Pan.BehaviouralCPU();
    const lockstep = new Spatula.LockstepRunner(griddle, pan, FlapjackUtils);
    const spatula = new Spatula.TimeTraveler(pan, FlapjackUtils, 4096);
    const speaker = new FlapjackSound.LiveSpeaker();

    let currentWords = gameAsm.words;
    let mode = 'pan'; // 'griddle' | 'pan' | 'lockstep'
    let running = false;
    let demoActive = false;
    let demoFrame = 0;
    let heldKeys = 0;
    let rafId = null;
    let lastSpkIdx = 0;
    let lastSpkCycle = 0;

    function loadIntoAll(words) {
      currentWords = words;
      griddle.bus.loadProgram(words, 0);
      pan.loadProgram(words, 0);
      griddle.reset(true);
      pan.reset(true);
      lockstep.history = [];
      lockstep.mismatch = null;
      spatula.init();
      demoActive = false;
      demoFrame = 0;
      lastSpkIdx = 0;
      lastSpkCycle = 0;
    }

    loadIntoAll(currentWords);

    // ---- Top Header ----
    const statusLine = el('div', { class: 'status-bar', text: 'Ready (idle). Press Play, Run Demo, or Step.' });
    const audioLine = el('div', { class: 'audio-bar', text: speaker.statusText });

    // ---- Video Canvas (64x48 scaled x7 -> 448x336) ----
    const screenCanvas = el('canvas', { width: '64', height: '48', class: 'vram-canvas' });
    const screenCtx = screenCanvas.getContext('2d');
    const imgData = screenCtx.createImageData(64, 48);

    // Pre-parse hex palette to RGB tuples
    const palRgb = FlapjackUtils.PALETTE.map(hex => [
      parseInt(hex.slice(1, 3), 16),
      parseInt(hex.slice(3, 5), 16),
      parseInt(hex.slice(5, 7), 16)
    ]);

    function renderScreen() {
      const vram = (mode === 'griddle' || mode === 'lockstep') ? griddle.bus.vram : pan.vram;
      const d = imgData.data;
      for (let i = 0; i < 3072; i++) {
        const rgb = palRgb[vram[i] & 15];
        const o = i * 4;
        d[o] = rgb[0];
        d[o + 1] = rgb[1];
        d[o + 2] = rgb[2];
        d[o + 3] = 255;
      }
      screenCtx.putImageData(imgData, 0, 0);
    }

    // ---- Mode & Controls ----
    const modeSel = el('select', { class: 'ctrl-select', onChange: (e) => { mode = e.target.value; refreshUI(); } }, [
      el('option', { value: 'pan', text: 'Pan (Fast Behavioural Twin)' }),
      el('option', { value: 'griddle', text: 'Griddle (Pure NAND Gates)' }),
      el('option', { value: 'lockstep', text: 'Lockstep (Griddle vs Pan Diff)' })
    ]);

    const btnPlay = el('button', { class: 'btn btn-primary', text: 'Play', onClick: togglePlay });
    const btnDemo = el('button', { class: 'btn', text: 'Run 600-Frame Demo', onClick: startDemo });
    const btnStepCyc = el('button', { class: 'btn', text: 'Step Cycle', onClick: doStepCycle });
    const btnStepInsn = el('button', { class: 'btn', text: 'Step Insn', onClick: doStepInsn });
    const btnReset = el('button', { class: 'btn', text: 'Reset', onClick: () => { stopLoop(); loadIntoAll(currentWords); statusLine.textContent = 'Machine reset.'; refreshUI(); } });
    const btnSound = el('button', { class: 'btn', text: 'Sound: Off', onClick: toggleSound });
    const btnWav = el('button', { class: 'btn', text: 'Render Demo WAV', onClick: doRenderWav });
    const btnTests = el('button', { class: 'btn btn-accent', text: 'Taste Test (42 Suites)', onClick: toggleTestPanel });

    // On-screen mouse/touch game pad
    function makePadBtn(label, bit) {
      const down = () => { heldKeys |= bit; };
      const up = () => { heldKeys &= ~bit; };
      return el('button', {
        class: 'btn pad-btn', text: label,
        onMouseDown: down, onMouseUp: up, onMouseLeave: up,
        onTouchStart: (e) => { e.preventDefault(); down(); },
        onTouchEnd: (e) => { e.preventDefault(); up(); }
      });
    }

    window.addEventListener('keydown', (e) => {
      if (e.target && (e.target.tagName === 'TEXTAREA' || e.target.tagName === 'INPUT')) return;
      if (e.code === 'ArrowLeft') { heldKeys |= 1; e.preventDefault(); }
      else if (e.code === 'ArrowRight') { heldKeys |= 2; e.preventDefault(); }
      else if (e.code === 'Space') { heldKeys |= 4; e.preventDefault(); }
    });
    window.addEventListener('keyup', (e) => {
      if (e.code === 'ArrowLeft') heldKeys &= ~1;
      else if (e.code === 'ArrowRight') heldKeys &= ~2;
      else if (e.code === 'Space') heldKeys &= ~4;
    });

    // ---- Spatula Panel (Time-Travel Debugger) ----
    const btnBack = el('button', { class: 'btn', text: '← Step Back', onClick: () => {
      stopLoop();
      if (mode !== 'pan') { mode = 'pan'; modeSel.value = 'pan'; }
      spatula.stepBackward();
      refreshUI();
    }});
    const btnFwd = el('button', { class: 'btn', text: 'Step Fwd →', onClick: () => {
      stopLoop();
      if (mode !== 'pan') { mode = 'pan'; modeSel.value = 'pan'; }
      spatula.setKeys(heldKeys);
      spatula.stepForward();
      refreshUI();
    }});
    const scrubRange = el('input', { type: 'range', min: '0', max: '0', value: '0', class: 'scrub-slider', onInput: (e) => {
      stopLoop();
      if (mode !== 'pan') { mode = 'pan'; modeSel.value = 'pan'; }
      spatula.scrubTo(parseInt(e.target.value, 10));
      refreshUI();
    }});
    const scrubLabel = el('span', { class: 'mono', text: 'Retired: 0 / 0' });
    const regBox = el('pre', { class: 'mono-box' });
    const descLine = el('div', { class: 'desc-line', text: 'Last instruction: (none)' });
    const disasmBox = el('pre', { class: 'mono-box' });
    const memAddrInput = el('input', { type: 'text', value: '0x0500', class: 'hex-input', onChange: refreshUI });
    const memBox = el('pre', { class: 'mono-box' });
    const lockstepBox = el('pre', { class: 'mono-box' });

    // ---- Syrup Panel (Power Heatmap) ----
    const syrupCanvas = el('canvas', { width: '420', height: '190', class: 'syrup-canvas' });
    const syrupCtx = syrupCanvas.getContext('2d');
    const syrupStats = el('div', { class: 'mono-small' });

    function renderSyrup() {
      const sum = Syrup.summarize(netlist, griddle.toggles, griddle.cycles);
      const rects = [];
      Syrup.layoutTree(sum.root, 0, 0, syrupCanvas.width, syrupCanvas.height, 0, griddle.cycles, rects);
      syrupCtx.fillStyle = '#181417';
      syrupCtx.fillRect(0, 0, syrupCanvas.width, syrupCanvas.height);

      let maxDens = 0.0001;
      for (let i = 1; i < rects.length; i++) {
        if (rects[i].density > maxDens) maxDens = rects[i].density;
      }
      for (let i = 1; i < rects.length; i++) {
        const r = rects[i];
        if (r.w < 2 || r.h < 2) continue;
        syrupCtx.fillStyle = Syrup.heatColor(r.density / maxDens);
        syrupCtx.fillRect(r.x, r.y, r.w, r.h);
        syrupCtx.strokeStyle = '#141013';
        syrupCtx.lineWidth = 1;
        syrupCtx.strokeRect(r.x, r.y, r.w, r.h);
        if (r.depth === 1 && r.w > 42 && r.h > 14) {
          syrupCtx.fillStyle = '#fff5e6';
          syrupCtx.font = '10px monospace';
          syrupCtx.fillText(r.name, r.x + 3, r.y + 10);
        }
      }

      const topTxt = sum.hottestThree.map(b => b.block + ' (' + b.toggles + ' toggles, ' + b.togglesPerCycle.toFixed(1) + '/cyc)').join(' | ');
      syrupStats.textContent = 'Total toggles: ' + sum.totalToggles +
        ' | Energy: ' + sum.totalJoules.toExponential(3) + ' J (1.0 pJ/toggle)' +
        (sum.totalToggles > 0 ? ' | Top 3: ' + topTxt : ' | Run Griddle or Lockstep to measure gate toggles.');
    }

    // ---- Batter Build Report Panel ----
    const rep = netlist.report;
    const batterInfo = el('pre', {
      class: 'mono-box',
      text: [
        'Total NAND gates:    ' + rep.totalNands,
        'Flip-flops (NAND):   ' + rep.flipFlopCount,
        'Critical-path depth: ' + rep.criticalPathDepth + ' gates (' + rep.criticalPathTarget + ')',
        'Netlist SHA-256:     ' + rep.sha256,
        'Top-level blocks:    ' + Object.keys(rep.topLevelCounts).map(k => k.replace('cpu/', '') + '=' + rep.topLevelCounts[k]).join(', ')
      ].join('\n')
    });

    // ---- Whisk Assembler Panel ----
    const asmInput = el('textarea', { class: 'asm-editor', rows: '14', spellcheck: 'false' });
    asmInput.value = PancakeGame.PANCAKE_ASM.trim();
    const asmOut = el('pre', { class: 'mono-box' });
    const btnAssemble = el('button', { class: 'btn btn-primary', text: 'Assemble & Load', onClick: () => {
      stopLoop();
      const res = Whisk.assemble(asmInput.value);
      if (!res.ok) {
        asmOut.textContent = res.errors.map(e => 'Line ' + e.line + ', Col ' + e.col + ': ' + e.message).join('\n');
        return;
      }
      loadIntoAll(res.words);
      const symText = Object.keys(res.symbols).slice(0, 30).map(k => k + '=' + FlapjackUtils.hex16(res.symbols[k])).join('  ');
      const listText = res.listing.slice(0, 40).map(l => FlapjackUtils.hex16(l.addr) + ': ' + l.words.map(FlapjackUtils.hex16).join(' ') + '  ; ' + l.source).join('\n');
      asmOut.textContent = 'Assembled ' + res.words.length + ' words (' + Object.keys(res.symbols).length + ' symbols).\nSymbols: ' + symText + '\n\nListing (first 40 lines):\n' + listText;
      statusLine.textContent = 'Loaded assembled program (' + res.words.length + ' words).';
      refreshUI();
    }});
    const btnDisasm = el('button', { class: 'btn', text: 'Disassemble Loaded', onClick: () => {
      asmInput.value = Whisk.disassemble(currentWords, 0);
      asmOut.textContent = 'Disassembled ' + currentWords.length + ' words into editor.';
    }});

    // ---- Taste Test Panel (hidden until user clicks button) ----
    const testModal = el('div', { class: 'test-panel hidden' });
    const testProgress = el('div', { class: 'status-bar', text: 'Click "Run All 42 Suites" to execute.' });
    const testTableBody = el('tbody');
    const btnRunAllTests = el('button', { class: 'btn btn-primary', text: 'Run All 42 Suites', onClick: runAllTestsAsync });
    const btnCloseTests = el('button', { class: 'btn', text: 'Close', onClick: () => testModal.classList.add('hidden') });

    testModal.appendChild(el('div', { class: 'panel-header' }, [
      el('h2', { text: 'Taste Test — 42 Verification Suites' }),
      el('div', { class: 'btn-row' }, [btnRunAllTests, btnCloseTests])
    ]));
    testModal.appendChild(testProgress);
    const testTable = el('table', { class: 'test-table' }, [
      el('thead', null, [
        el('tr', null, [
          el('th', { text: '#' }),
          el('th', { text: 'Suite' }),
          el('th', { text: 'Result' }),
          el('th', { text: 'Time (ms)' }),
          el('th', { text: 'Measured Metrics' })
        ])
      ]),
      testTableBody
    ]);
    testModal.appendChild(testTable);

    function toggleTestPanel() {
      testModal.classList.toggle('hidden');
    }

    function runAllTestsAsync() {
      stopLoop();
      clearNode(testTableBody);
      btnRunAllTests.disabled = true;
      const deps = { Utils: FlapjackUtils, Batter, Griddle, Pan, Whisk, Spatula, Syrup, Sound: FlapjackSound, Game: PancakeGame };
      const { suites } = TasteTest.buildSuites(deps, {
        getHtmlSource: () => '<!DOCTYPE html>\n' + document.documentElement.outerHTML
      });
      let idx = 0;
      let passed = 0;
      const tStart = Date.now();

      function nextSuite() {
        if (idx >= suites.length) {
          testProgress.textContent = 'Completed ' + suites.length + ' suites: ' + passed + ' PASS, ' + (suites.length - passed) + ' FAIL in ' + ((Date.now() - tStart) / 1000).toFixed(2) + 's.';
          btnRunAllTests.disabled = false;
          return;
        }
        const s = suites[idx++];
        testProgress.textContent = 'Running suite ' + s.id + '/' + suites.length + ': ' + s.name + '...';
        setTimeout(() => {
          const t0 = Date.now();
          let res;
          try {
            res = s.run();
          } catch (err) {
            res = { pass: false, metrics: { error: String(err && err.message ? err.message : err) } };
          }
          const dt = Date.now() - t0;
          if (res.pass) passed++;
          const tr = el('tr', { class: res.pass ? 'row-pass' : 'row-fail' }, [
            el('td', { text: String(s.id) }),
            el('td', { text: s.name }),
            el('td', { text: res.pass ? 'PASS' : 'FAIL' }),
            el('td', { text: String(dt) }),
            el('td', { class: 'mono-cell', text: JSON.stringify(res.metrics) })
          ]);
          testTableBody.appendChild(tr);
          nextSuite();
        }, 10);
      }
      nextSuite();
    }

    // ---- Execution Actions ----
    function stopLoop() {
      running = false;
      btnPlay.textContent = 'Play';
      if (rafId !== null) { cancelAnimationFrame(rafId); rafId = null; }
    }

    function togglePlay() {
      if (running) {
        stopLoop();
        statusLine.textContent = 'Paused.';
        return;
      }
      running = true;
      btnPlay.textContent = 'Pause';
      statusLine.textContent = 'Running in ' + mode + ' mode...';
      rafId = requestAnimationFrame(tickFrame);
    }

    function startDemo() {
      stopLoop();
      loadIntoAll(gameAsm.words);
      demoActive = true;
      demoFrame = 0;
      running = true;
      btnPlay.textContent = 'Pause';
      statusLine.textContent = 'Running 600-frame demo in ' + mode + ' mode...';
      rafId = requestAnimationFrame(tickFrame);
    }

    function stepOneFrame(keys) {
      if (mode === 'pan') {
        spatula.setKeys(keys);
        const target = pan.ram[PancakeGame.VAR_FRAME] + 1;
        let guard = 0;
        while (pan.ram[PancakeGame.VAR_FRAME] < target && !pan.halted && guard < 1500) {
          spatula.stepForward();
          guard++;
        }
        if (speaker.enabled && pan.speakerLog.length > lastSpkIdx) {
          speaker.playSlice(pan.speakerLog, lastSpkIdx, lastSpkCycle, pan.cycles);
          lastSpkIdx = pan.speakerLog.length;
        }
        lastSpkCycle = pan.cycles;
      } else if (mode === 'griddle') {
        griddle.bus.keys = keys;
        const target = griddle.bus.ram[PancakeGame.VAR_FRAME] + 1;
        let guard = 0;
        while (griddle.bus.ram[PancakeGame.VAR_FRAME] < target && !griddle.getState().halted && guard < 1500) {
          const r = griddle.stepInstruction();
          if (r.oscillation) { statusLine.textContent = 'Oscillation detected!'; stopLoop(); break; }
          guard++;
        }
        if (speaker.enabled && griddle.bus.speakerLog.length > lastSpkIdx) {
          speaker.playSlice(griddle.bus.speakerLog, lastSpkIdx, lastSpkCycle, griddle.cycles);
          lastSpkIdx = griddle.bus.speakerLog.length;
        }
        lastSpkCycle = griddle.cycles;
      } else {
        lockstep.setKeys(keys);
        const target = pan.ram[PancakeGame.VAR_FRAME] + 1;
        let guard = 0;
        while (pan.ram[PancakeGame.VAR_FRAME] < target && !pan.halted && guard < 1500) {
          const r = lockstep.stepInstruction();
          if (!r.ok) {
            statusLine.textContent = 'LOCKSTEP MISMATCH on ' + r.mismatch.field + ' at retired #' + r.mismatch.retired;
            stopLoop();
            break;
          }
          guard++;
        }
      }
    }

    function tickFrame() {
      if (!running) return;
      if (demoActive) {
        if (demoFrame >= 600) {
          demoActive = false;
          stopLoop();
          const st = (mode === 'pan') ? pan.getState() : griddle.getState();
          statusLine.textContent = '600-frame demo complete (' + mode + '). Video FNV-1a: ' + FlapjackUtils.hex32(st.videoHash);
          refreshUI();
          return;
        }
        stepOneFrame(PancakeGame.DEMO_TAPE[demoFrame]);
        demoFrame++;
        statusLine.textContent = 'Demo frame ' + demoFrame + '/600 (' + mode + ')';
      } else {
        stepOneFrame(heldKeys);
      }
      refreshUI();
      if (running) rafId = requestAnimationFrame(tickFrame);
    }

    function doStepCycle() {
      stopLoop();
      if (mode === 'pan') { mode = 'griddle'; modeSel.value = 'griddle'; }
      griddle.bus.keys = heldKeys;
      const r = griddle.stepCycle();
      statusLine.textContent = r.settled ? ('Stepped 1 clock cycle (total ' + griddle.cycles + ')') : 'Oscillation detected!';
      refreshUI();
    }

    function doStepInsn() {
      stopLoop();
      if (mode === 'pan') { spatula.setKeys(heldKeys); spatula.stepForward(); }
      else if (mode === 'griddle') { griddle.bus.keys = heldKeys; griddle.stepInstruction(); }
      else { lockstep.setKeys(heldKeys); lockstep.stepInstruction(); }
      refreshUI();
    }

    async function toggleSound() {
      if (speaker.enabled) {
        speaker.disable();
        btnSound.textContent = 'Sound: Off';
      } else {
        const ok = await speaker.enable();
        btnSound.textContent = ok ? 'Sound: On' : 'Sound: Blocked';
      }
      audioLine.textContent = speaker.statusText;
    }

    function doRenderWav() {
      const p = new Pan.BehaviouralCPU();
      TasteTest.runDemoFramesSingle(p, gameAsm.words, PancakeGame.DEMO_TAPE, 600, PancakeGame.VAR_FRAME);
      const w = FlapjackSound.renderWav(p.speakerLog, p.cycles, FlapjackUtils);
      audioLine.textContent = 'Rendered offline WAV: ' + w.wav.length + ' bytes, ' + w.numSamples + ' samples @ 22,050 Hz, embedded PCM CRC-32: ' + FlapjackUtils.hex32(w.pcmCrc32) + ', WAV CRC-32: ' + FlapjackUtils.hex32(w.wavCrc32);
      try {
        const blob = new Blob([w.wav], { type: 'audio/wav' });
        const url = URL.createObjectURL(blob);
        const a = el('a', { href: url, download: 'flapjack-demo-600.wav' });
        document.body.appendChild(a);
        a.click();
        document.body.removeChild(a);
        setTimeout(() => URL.revokeObjectURL(url), 5000);
      } catch (_) {}
    }

    function refreshUI() {
      renderScreen();
      const activeCpu = (mode === 'griddle') ? griddle : pan;
      const st = activeCpu.getState();
      const mem = activeCpu.bus ? activeCpu.bus.ram : activeCpu.ram;

      scrubRange.max = String(spatula.furthest);
      scrubRange.value = String(pan.retired);
      scrubLabel.textContent = 'Retired: ' + st.retired + ' (Spatula max: ' + spatula.furthest + ', cycles: ' + st.cycles + ')';

      const regLines = [
        'PC=' + FlapjackUtils.hex16(st.pc) + '  IR=' + FlapjackUtils.hex16(st.ir) +
        '  Flags: Z=' + st.flags.z + ' N=' + st.flags.n + ' C=' + st.flags.c + ' V=' + st.flags.v + (st.halted ? ' [HALTED]' : ''),
        'R0=' + FlapjackUtils.hex16(st.regs[0]) + ' R1=' + FlapjackUtils.hex16(st.regs[1]) + ' R2=' + FlapjackUtils.hex16(st.regs[2]) + ' R3=' + FlapjackUtils.hex16(st.regs[3]),
        'R4=' + FlapjackUtils.hex16(st.regs[4]) + ' R5=' + FlapjackUtils.hex16(st.regs[5]) + ' R6=' + FlapjackUtils.hex16(st.regs[6]) + ' R7=' + FlapjackUtils.hex16(st.regs[7]),
        'Score=' + mem[0x050C] + '  Flips=' + mem[0x0513] + '  CookA=' + mem[0x050A] + '  CookB=' + mem[0x050B] + '  Burnt=' + mem[0x050D] + '  VRAM=' + FlapjackUtils.hex32(st.videoHash)
      ];
      regBox.textContent = regLines.join('\n');

      // Plain-language description of instruction at PC
      const wPc = mem[st.pc] || 0;
      const immPc = mem[(st.pc + 1) & 0xffff] || 0;
      descLine.textContent = 'Next @ ' + FlapjackUtils.hex16(st.pc) + ': ' + Whisk.describeInstruction(wPc, immPc);

      // Disassembly around PC
      const dLines = [];
      let cur = Math.max(0, st.pc - 4);
      for (let i = 0; i < 8 && cur < 0xe000; i++) {
        const slice = [mem[cur], mem[(cur + 1) & 0xffff]];
        const d = Whisk.disassembleOne(slice, 0);
        const mark = cur === st.pc ? '>> ' : '   ';
        dLines.push(mark + FlapjackUtils.hex16(cur) + ': ' + d.text);
        cur += d.size;
      }
      disasmBox.textContent = dLines.join('\n');

      // Memory viewer
      let base = parseInt(memAddrInput.value.trim(), 16);
      if (isNaN(base) || base < 0 || base >= 0xe000) base = 0x0500;
      const mLines = [];
      for (let row = 0; row < 4; row++) {
        const a = (base + row * 8) & 0xffff;
        const vals = [];
        for (let c = 0; c < 8; c++) vals.push(FlapjackUtils.hex16(mem[(a + c) & 0xffff] || 0).slice(2));
        mLines.push(FlapjackUtils.hex16(a) + ': ' + vals.join(' '));
      }
      memBox.textContent = mLines.join('\n');

      // Lockstep status
      if (lockstep.mismatch) {
        lockstepBox.textContent = 'MISMATCH: ' + JSON.stringify(lockstep.mismatch, null, 2);
      } else {
        lockstepBox.textContent = 'Lockstep OK (0 mismatches). Griddle retired=' + griddle.retired + ', Pan retired=' + pan.retired + ', WriteHash=' + FlapjackUtils.hex32(st.writeHash);
      }

      renderSyrup();
    }

    // ---- Assemble Page Layout ----
    const header = el('header', { class: 'top-bar' }, [
      el('div', null, [
        el('h1', { text: 'FLAPJACK' }),
        el('p', { class: 'subtitle', text: '16-bit NAND-Gate Computer & Pancake Flipping Simulator (Zero Dependencies)' })
      ]),
      el('div', { class: 'btn-row' }, [btnTests])
    ]);

    const leftCol = el('section', { class: 'card' }, [
      el('h2', { text: 'Griddle Display (64×48, 16-Colour VRAM)' }),
      screenCanvas,
      el('div', { class: 'pad-row' }, [
        makePadBtn('◀ Left', 1),
        makePadBtn('▲ Flip (Space)', 4),
        makePadBtn('▶ Right', 2)
      ]),
      el('div', { class: 'ctrl-row' }, [modeSel, btnPlay, btnDemo, btnStepInsn, btnStepCyc, btnReset]),
      el('div', { class: 'ctrl-row' }, [btnSound, btnWav]),
      statusLine,
      audioLine,
      el('h3', { text: 'Syrup — Live Power Heatmap' }),
      syrupCanvas,
      syrupStats
    ]);

    const rightCol = el('section', { class: 'card' }, [
      el('h2', { text: 'Spatula — Time-Travel Debugger & Lockstep' }),
      el('div', { class: 'ctrl-row' }, [btnBack, btnFwd, scrubLabel]),
      scrubRange,
      regBox,
      descLine,
      el('h3', { text: 'Disassembly Around PC' }),
      disasmBox,
      el('div', { class: 'ctrl-row' }, [el('span', { text: 'Memory @ ' }), memAddrInput]),
      memBox,
      el('h3', { text: 'Lockstep Diff Status' }),
      lockstepBox,
      el('h3', { text: 'Batter — Silicon Compiler Build Report' }),
      batterInfo
    ]);

    const bottomRow = el('section', { class: 'card full-width' }, [
      el('h2', { text: 'Whisk — Two-Pass Assembler & Disassembler' }),
      el('div', { class: 'ctrl-row' }, [btnAssemble, btnDisasm]),
      asmInput,
      asmOut
    ]);

    root.appendChild(header);
    root.appendChild(testModal);
    root.appendChild(el('main', { class: 'grid' }, [leftCol, rightCol]));
    root.appendChild(bottomRow);

    refreshUI();
  }

  return { init };
})();

if (typeof window !== 'undefined') {
  window.addEventListener('DOMContentLoaded', () => FlapjackUI.init());
}
</script>
</body>
</html>
