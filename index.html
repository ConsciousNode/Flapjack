<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>FLAPJACK — 16-bit NAND-Gate Computer &amp; Pancake Game</title>
<style>
:root {
  --bg: #181316;
  --panel: #241d21;
  --border: #3d3138;
  --text: #f3e8da;
  --muted: #b8a596;
  --accent: #e09132;
  --accent2: #d94136;
  --green: #4fa65b;
}
* { box-sizing: border-box; }
body {
  margin: 0;
  padding: 16px;
  background: var(--bg);
  color: var(--text);
  font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  line-height: 1.4;
}
#app { max-width: 1200px; margin: 0 auto; }
.top-bar {
  display: flex;
  justify-content: space-between;
  align-items: center;
  border-bottom: 2px solid var(--accent);
  padding-bottom: 10px;
  margin-bottom: 14px;
}
.top-bar h1 { margin: 0; font-size: 26px; letter-spacing: 2px; color: var(--accent); }
.subtitle { margin: 2px 0 0; font-size: 13px; color: var(--muted); }
.grid { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
@media (max-width: 900px) { .grid { grid-template-columns: 1fr; } }
.card {
  background: var(--panel);
  border: 1px solid var(--border);
  border-radius: 8px;
  padding: 14px;
}
.full-width { margin-top: 14px; }
h2 { margin: 0 0 10px; font-size: 16px; color: #f6c978; }
h3 { margin: 12px 0 6px; font-size: 13px; color: var(--muted); text-transform: uppercase; letter-spacing: 0.6px; }
.vram-canvas {
  width: 100%;
  max-width: 448px;
  aspect-ratio: 4 / 3;
  image-rendering: pixelated;
  border: 2px solid var(--border);
  border-radius: 4px;
  background: #141013;
  display: block;
}
.syrup-canvas {
  width: 100%;
  max-width: 448px;
  height: 190px;
  border: 1px solid var(--border);
  border-radius: 4px;
  display: block;
}
.ctrl-row, .pad-row, .btn-row {
  display: flex;
  flex-wrap: wrap;
  gap: 6px;
  margin: 8px 0;
  align-items: center;
}
.btn {
  background: #33292f;
  color: var(--text);
  border: 1px solid #52424b;
  border-radius: 5px;
  padding: 6px 10px;
  font-size: 13px;
  cursor: pointer;
}
.btn:hover { background: #44373f; }
.btn:disabled { opacity: 0.5; cursor: default; }
.btn-primary { background: #b8661c; border-color: #e09132; color: #fff; font-weight: 600; }
.btn-primary:hover { background: #cf7724; }
.btn-accent { background: #3f6f46; border-color: #5ca868; color: #fff; font-weight: 600; }
.pad-btn { min-width: 96px; font-weight: 600; }
.ctrl-select, .hex-input {
  background: #191417;
  color: var(--text);
  border: 1px solid var(--border);
  border-radius: 4px;
  padding: 5px 8px;
  font-size: 13px;
}
.hex-input { width: 90px; font-family: ui-monospace, monospace; }
.scrub-slider { width: 100%; margin: 6px 0; }
.status-bar, .audio-bar, .desc-line {
  font-size: 12px;
  padding: 5px 8px;
  border-radius: 4px;
  background: #1a1418;
  border: 1px solid var(--border);
  margin: 5px 0;
}
.audio-bar { color: #d8c2a6; }
.desc-line { color: #f6c978; }
.mono, .mono-small { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 12px; color: var(--muted); }
.mono-box {
  background: #141013;
  border: 1px solid var(--border);
  border-radius: 4px;
  padding: 8px;
  font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
  font-size: 12px;
  color: #e8d8c3;
  overflow-x: auto;
  margin: 6px 0;
  white-space: pre;
}
.asm-editor {
  width: 100%;
  background: #141013;
  color: #f3e8da;
  border: 1px solid var(--border);
  border-radius: 4px;
  padding: 8px;
  font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
  font-size: 12px;
}
.test-panel {
  background: #1f191d;
  border: 2px solid var(--accent);
  border-radius: 8px;
  padding: 14px;
  margin-bottom: 14px;
}
.panel-header { display: flex; justify-content: space-between; align-items: center; }
.hidden { display: none; }
.test-table { width: 100%; border-collapse: collapse; font-size: 12px; margin-top: 8px; }
.test-table th, .test-table td { border: 1px solid var(--border); padding: 4px 6px; text-align: left; }
.test-table th { background: #2c2328; }
.row-pass td:nth-child(3) { color: #75d983; font-weight: 700; }
.row-fail td:nth-child(3) { color: #ff6b61; font-weight: 700; }
.mono-cell { font-family: ui-monospace, monospace; font-size: 11px; max-width: 460px; overflow-wrap: anywhere; }
</style>
</head>

<script id="utils-module">
// utils.js — Pure-JS SHA-256, CRC-32, FNV-1a, and deterministic PRNG (zero dependencies)
const FlapjackUtils = (() => {
  // SHA-256 (FIPS 180-4) over UTF-8 string or Uint8Array
  const K256 = new Uint32Array([
    0x428a2f98, 0x71374491, 0xb5c0fbcf, 0xe9b5dba5, 0x3956c25b, 0x59f111f1, 0x923f82a4, 0xab1c5ed5,
    0xd807aa98, 0x12835b01, 0x243185be, 0x550c7dc3, 0x72be5d74, 0x80deb1fe, 0x9bdc06a7, 0xc19bf174,
    0xe49b69c1, 0xefbe4786, 0x0fc19dc6, 0x240ca1cc, 0x2de92c6f, 0x4a7484aa, 0x5cb0a9dc, 0x76f988da,
    0x983e5152, 0xa831c66d, 0xb00327c8, 0xbf597fc7, 0xc6e00bf3, 0xd5a79147, 0x06ca6351, 0x14292967,
    0x27b70a85, 0x2e1b2138, 0x4d2c6dfc, 0x53380d13, 0x650a7354, 0x766a0abb, 0x81c2c92e, 0x92722c85,
    0xa2bfe8a1, 0xa81a664b, 0xc24b8b70, 0xc76c51a3, 0xd192e819, 0xd6990624, 0xf40e3585, 0x106aa070,
    0x19a4c116, 0x1e376c08, 0x2748774c, 0x34b0bcb5, 0x391c0cb3, 0x4ed8aa4a, 0x5b9cca4f, 0x682e6ff3,
    0x748f82ee, 0x78a5636f, 0x84c87814, 0x8cc70208, 0x90befffa, 0xa4506ceb, 0xbef9a3f7, 0xc67178f2
  ]);

  function utf8Bytes(str) {
    const out = [];
    for (let i = 0; i < str.length; i++) {
      let c = str.charCodeAt(i);
      if (c < 0x80) {
        out.push(c);
      } else if (c < 0x800) {
        out.push(0xc0 | (c >> 6), 0x80 | (c & 0x3f));
      } else if ((c & 0xfc00) === 0xd800 && i + 1 < str.length && (str.charCodeAt(i + 1) & 0xfc00) === 0xdc00) {
        c = 0x10000 + (((c & 0x3ff) << 10) | (str.charCodeAt(++i) & 0x3ff));
        out.push(0xf0 | (c >> 18), 0x80 | ((c >> 12) & 0x3f), 0x80 | ((c >> 6) & 0x3f), 0x80 | (c & 0x3f));
      } else {
        out.push(0xe0 | (c >> 12), 0x80 | ((c >> 6) & 0x3f), 0x80 | (c & 0x3f));
      }
    }
    return new Uint8Array(out);
  }

  function sha256(input) {
    const bytes = typeof input === 'string' ? utf8Bytes(input) : input;
    const bitLenHi = Math.floor((bytes.length * 8) / 0x100000000);
    const bitLenLo = (bytes.length * 8) >>> 0;
    const padLen = ((bytes.length + 9 + 63) >> 6) << 6;
    const buf = new Uint8Array(padLen);
    buf.set(bytes);
    buf[bytes.length] = 0x80;
    const view = new DataView(buf.buffer);
    view.setUint32(padLen - 8, bitLenHi, false);
    view.setUint32(padLen - 4, bitLenLo, false);

    let h0 = 0x6a09e667, h1 = 0xbb67ae85, h2 = 0x3c6ef372, h3 = 0xa54ff53a;
    let h4 = 0x510e527f, h5 = 0x9b05688c, h6 = 0x1f83d9ab, h7 = 0x5be0cd19;
    const w = new Uint32Array(64);

    for (let off = 0; off < padLen; off += 64) {
      for (let i = 0; i < 16; i++) w[i] = view.getUint32(off + i * 4, false);
      for (let i = 16; i < 64; i++) {
        const s0 = ((w[i - 15] >>> 7) | (w[i - 15] << 25)) ^ ((w[i - 15] >>> 18) | (w[i - 15] << 14)) ^ (w[i - 15] >>> 3);
        const s1 = ((w[i - 2] >>> 17) | (w[i - 2] << 15)) ^ ((w[i - 2] >>> 19) | (w[i - 2] << 13)) ^ (w[i - 2] >>> 10);
        w[i] = (w[i - 16] + s0 + w[i - 7] + s1) >>> 0;
      }
      let a = h0, b = h1, c = h2, d = h3, e = h4, f = h5, g = h6, h = h7;
      for (let i = 0; i < 64; i++) {
        const S1 = ((e >>> 6) | (e << 26)) ^ ((e >>> 11) | (e << 21)) ^ ((e >>> 25) | (e << 7));
        const ch = (e & f) ^ (~e & g);
        const t1 = (h + S1 + ch + K256[i] + w[i]) >>> 0;
        const S0 = ((a >>> 2) | (a << 30)) ^ ((a >>> 13) | (a << 19)) ^ ((a >>> 22) | (a << 10));
        const maj = (a & b) ^ (a & c) ^ (b & c);
        const t2 = (S0 + maj) >>> 0;
        h = g; g = f; f = e; e = (d + t1) >>> 0;
        d = c; c = b; b = a; a = (t1 + t2) >>> 0;
      }
      h0 = (h0 + a) >>> 0; h1 = (h1 + b) >>> 0; h2 = (h2 + c) >>> 0; h3 = (h3 + d) >>> 0;
      h4 = (h4 + e) >>> 0; h5 = (h5 + f) >>> 0; h6 = (h6 + g) >>> 0; h7 = (h7 + h) >>> 0;
    }
    const hs = [h0, h1, h2, h3, h4, h5, h6, h7];
    let hex = '';
    for (let i = 0; i < 8; i++) hex += hs[i].toString(16).padStart(8, '0');
    return hex;
  }

  // CRC-32 (IEEE 802.3 polynomial 0xEDB88320)
  const CRC_TABLE = new Uint32Array(256);
  for (let i = 0; i < 256; i++) {
    let c = i;
    for (let j = 0; j < 8; j++) c = (c & 1) ? (0xedb88320 ^ (c >>> 1)) : (c >>> 1);
    CRC_TABLE[i] = c >>> 0;
  }

  function crc32(bytes) {
    let c = 0xffffffff;
    for (let i = 0; i < bytes.length; i++) {
      c = CRC_TABLE[(c ^ bytes[i]) & 0xff] ^ (c >>> 8);
    }
    return ((c ^ 0xffffffff) >>> 0);
  }

  // FNV-1a 32-bit
  const FNV_OFFSET = 0x811c9dc5;
  const FNV_PRIME = 0x01000193;

  function fnv1aStep(h, word16) {
    h = Math.imul((h ^ (word16 & 0xff)) >>> 0, FNV_PRIME) >>> 0;
    h = Math.imul((h ^ ((word16 >>> 8) & 0xff)) >>> 0, FNV_PRIME) >>> 0;
    return h >>> 0;
  }

  function fnv1aWords(words, start = 0, length = words.length - start) {
    let h = FNV_OFFSET;
    const end = start + length;
    for (let i = start; i < end; i++) {
      h = fnv1aStep(h, words[i]);
    }
    return h >>> 0;
  }

  function hex16(v) {
    return '0x' + ((v & 0xffff) >>> 0).toString(16).toUpperCase().padStart(4, '0');
  }

  function hex32(v) {
    return ((v >>> 0).toString(16)).padStart(8, '0');
  }

  // Deterministic Mulberry32 PRNG for tests/fuzzing
  function makeRng(seed) {
    let s = seed >>> 0;
    return function next() {
      s = (s + 0x6d2b79f5) >>> 0;
      let t = Math.imul(s ^ (s >>> 15), 1 | s);
      t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
      return ((t ^ (t >>> 14)) >>> 0);
    };
  }

  // 16-colour pancake palette (RGBA hex)
  const PALETTE = [
    '#141013', // 0: charcoal griddle / night background
    '#2b2226', // 1: dark cast-iron pan
    '#4d3f45', // 2: pan rim highlight
    '#73646a', // 3: pan handle steel
    '#f6e3b4', // 4: raw batter cream
    '#f2c572', // 5: light golden pancake
    '#d98c36', // 6: perfect golden-brown pancake
    '#8c471c', // 7: crispy dark-brown edge
    '#381c14', // 8: burnt char
    '#f5d042', // 9: melting butter pad
    '#b85d19', // 10: maple syrup
    '#d94136', // 11: berry / danger red
    '#4fa65b', // 12: mint / score green
    '#5294c4', // 13: kitchen tile blue
    '#e8d8c3', // 14: warm cream UI / text
    '#ffffff'  // 15: bright sparkle / highlight
  ];

  return { sha256, crc32, FNV_OFFSET, fnv1aStep, fnv1aWords, hex16, hex32, makeRng, PALETTE };
})();

</script>

<script id="batter-module">
// batter.js — Structural NAND-only silicon compiler for FLAPJACK 16-bit CPU
const Batter = (() => {
  class CircuitBuilder {
    constructor(inputNames) {
      this.inputNames = inputNames.slice();
      this.numInputs = inputNames.length;
      this.gates = [];          // { id, a, b, out, block }
      this.blockStack = [];
      this.blockSet = new Map(); // blockPath -> blockId
      this.blockNames = [];
      this.flipFlops = [];      // { name, block, d, q, qb, gates: [gateIds] }
      this.ffGateSet = new Set();
    }

    pushBlock(name) {
      this.blockStack.push(name);
    }

    popBlock() {
      this.blockStack.pop();
    }

    withBlock(name, fn) {
      this.pushBlock(name);
      const res = fn();
      this.popBlock();
      return res;
    }

    currentBlock() {
      return this.blockStack.join('/') || 'root';
    }

    _getBlockId(path) {
      let id = this.blockSet.get(path);
      if (id === undefined) {
        id = this.blockNames.length;
        this.blockSet.set(path, id);
        this.blockNames.push(path);
      }
      return id;
    }

    // Primitive: 2-input NAND gate
    nand(a, b) {
      const id = this.gates.length;
      const out = this.numInputs + id;
      const block = this.currentBlock();
      this._getBlockId(block);
      this.gates.push({ id, a, b, out, block });
      return out;
    }

    // Reserve a NAND gate slot for feedback loops (e.g., cross-coupled latches)
    reserveNand() {
      const id = this.gates.length;
      const out = this.numInputs + id;
      const block = this.currentBlock();
      this._getBlockId(block);
      this.gates.push({ id, a: -1, b: -1, out, block });
      return { id, out };
    }

    patchNand(id, a, b) {
      this.gates[id].a = a;
      this.gates[id].b = b;
    }

    // Derived combinational primitives (all strictly NAND)
    not(a) { return this.nand(a, a); }
    and(a, b) { const t = this.nand(a, b); return this.nand(t, t); }
    or(a, b) { return this.nand(this.nand(a, a), this.nand(b, b)); }
    nor(a, b) { const t = this.or(a, b); return this.nand(t, t); }
    xor(a, b) {
      const t = this.nand(a, b);
      const u = this.nand(a, t);
      const v = this.nand(b, t);
      return this.nand(u, v);
    }
    xnor(a, b) { return this.not(this.xor(a, b)); }

    andN(wires) {
      if (wires.length === 1) return wires[0];
      let cur = wires.slice();
      while (cur.length > 1) {
        const next = [];
        for (let i = 0; i < cur.length; i += 2) {
          if (i + 1 < cur.length) next.push(this.and(cur[i], cur[i + 1]));
          else next.push(cur[i]);
        }
        cur = next;
      }
      return cur[0];
    }

    orN(wires) {
      if (wires.length === 1) return wires[0];
      let cur = wires.slice();
      while (cur.length > 1) {
        const next = [];
        for (let i = 0; i < cur.length; i += 2) {
          if (i + 1 < cur.length) next.push(this.or(cur[i], cur[i + 1]));
          else next.push(cur[i]);
        }
        cur = next;
      }
      return cur[0];
    }

    // 2:1 mux (uses pre-inverted selN to save gates across 16-bit buses)
    mux2(a, b, sel, selN) {
      const sN = selN !== undefined ? selN : this.not(sel);
      return this.nand(this.nand(a, sN), this.nand(b, sel));
    }

    mux2Bus(busA, busB, sel, selN) {
      const sN = selN !== undefined ? selN : this.not(sel);
      const out = new Array(busA.length);
      for (let i = 0; i < busA.length; i++) {
        out[i] = this.mux2(busA[i], busB[i], sel, sN);
      }
      return out;
    }

    mux4(d0, d1, d2, d3, s0, s0N, s1, s1N) {
      const m0 = this.mux2(d0, d1, s0, s0N);
      const m1 = this.mux2(d2, d3, s0, s0N);
      return this.mux2(m0, m1, s1, s1N);
    }

    mux4Bus(b0, b1, b2, b3, s0, s0N, s1, s1N) {
      const out = new Array(b0.length);
      for (let i = 0; i < b0.length; i++) {
        out[i] = this.mux4(b0[i], b1[i], b2[i], b3[i], s0, s0N, s1, s1N);
      }
      return out;
    }

    mux8(d, s0, s0N, s1, s1N, s2, s2N) {
      const m0 = this.mux4(d[0], d[1], d[2], d[3], s0, s0N, s1, s1N);
      const m1 = this.mux4(d[4], d[5], d[6], d[7], s0, s0N, s1, s1N);
      return this.mux2(m0, m1, s2, s2N);
    }

    mux8Bus(buses, s0, s0N, s1, s1N, s2, s2N) {
      const n = buses[0].length;
      const out = new Array(n);
      const slice = new Array(8);
      for (let i = 0; i < n; i++) {
        for (let k = 0; k < 8; k++) slice[k] = buses[k][i];
        out[i] = this.mux8(slice, s0, s0N, s1, s1N, s2, s2N);
      }
      return out;
    }

    // Level-sensitive gated D-latch (4 NANDs with cross-coupled feedback)
    dlatch(d, en) {
      const s = this.nand(d, en);
      const r = this.nand(s, en);
      const qSlot = this.reserveNand();
      const qb = this.nand(r, qSlot.out);
      this.patchNand(qSlot.id, s, qb);
      const qbId = qb - this.numInputs;
      const sId = s - this.numInputs;
      const rId = r - this.numInputs;
      return { q: qSlot.out, qb, gateIds: [sId, rId, qSlot.id, qbId] };
    }

    // Master-slave rising-edge D flip-flop with synchronous active-high reset (10 NANDs)
    // Master is transparent when clk=0 (clkN=1), locks on rising edge clk 0->1.
    // Slave is transparent when clk=1, holds when clk=0.
    dff(d, clk, clkN, rstN, name) {
      const dRst = this.and(d, rstN);
      const master = this.dlatch(dRst, clkN);
      const slave = this.dlatch(master.q, clk);
      const gateIds = master.gateIds.concat(slave.gateIds);
      for (let i = 0; i < gateIds.length; i++) this.ffGateSet.add(gateIds[i]);
      this.flipFlops.push({
        name: name || ('ff_' + this.flipFlops.length),
        block: this.currentBlock(),
        d,
        q: slave.q,
        qb: slave.qb,
        gates: gateIds
      });
      return { q: slave.q, qb: slave.qb };
    }

    // Half adder (5 NANDs)
    halfAdder(a, b) {
      const t = this.nand(a, b);
      const u = this.nand(a, t);
      const v = this.nand(b, t);
      const sum = this.nand(u, v);
      const carry = this.nand(t, t);
      return { sum, carry };
    }

    // Full adder (9 NANDs)
    fullAdder(a, b, cin) {
      const t1 = this.nand(a, b);
      const u1 = this.nand(a, t1);
      const v1 = this.nand(b, t1);
      const s1 = this.nand(u1, v1);
      const t2 = this.nand(s1, cin);
      const u2 = this.nand(s1, t2);
      const v2 = this.nand(cin, t2);
      const sum = this.nand(u2, v2);
      const cout = this.withBlock('carry', () => this.nand(t1, t2));
      return { sum, cout };
    }

    // 16-bit ripple-carry adder
    adder16(a, b, cin) {
      const sum = new Array(16);
      let c = cin;
      let c15 = cin;
      for (let i = 0; i < 16; i++) {
        if (i === 15) c15 = c;
        const bit = this.withBlock('bit' + i, () => this.fullAdder(a[i], b[i], c));
        sum[i] = bit.sum;
        c = bit.cout;
      }
      return { sum, cout: c, c15 };
    }

    // 16-bit incrementer (16 half adders = 80 NANDs)
    inc16(a, const1) {
      const sum = new Array(16);
      let c = const1;
      for (let i = 0; i < 16; i++) {
        const bit = this.withBlock('bit' + i, () => this.halfAdder(a[i], c));
        sum[i] = bit.sum;
        c = bit.carry;
      }
      return sum;
    }

    // 16-bit equality to a compile-time constant
    eq16Const(bus, val) {
      const bits = new Array(16);
      for (let i = 0; i < 16; i++) {
        bits[i] = ((val >>> i) & 1) ? bus[i] : this.not(bus[i]);
      }
      return this.andN(bits);
    }

    // 16-bit register with write enable (feedback wires created via reserve)
    reg16(we, clk, clkN, rstN, namePrefix) {
      // Returns { q[16], connectD(dBus) } so feedback loops from downstream logic can connect cleanly
      const weN = this.not(we);
      const q = new Array(16);
      const qb = new Array(16);
      const dMuxSlots = new Array(16);
      for (let i = 0; i < 16; i++) {
        // Reserve mux output NAND: mux2(q_old, d_new, we, weN)
        // We reserve the input NAND(d_new, we) so connectD patches its 'a' input!
        const bTerm = this.reserveNand();
        const aTerm = this.reserveNand();
        const dIn = this.nand(aTerm.out, bTerm.out);
        const ff = this.dff(dIn, clk, clkN, rstN, namePrefix + '_' + i);
        this.patchNand(aTerm.id, ff.q, weN);
        q[i] = ff.q;
        qb[i] = ff.qb;
        dMuxSlots[i] = { bTermId: bTerm.id, we };
      }
      return {
        q,
        qb,
        connectD: (dBus) => {
          for (let i = 0; i < 16; i++) {
            this.patchNand(dMuxSlots[i].bTermId, dBus[i], dMuxSlots[i].we);
          }
        }
      };
    }

    // Single-bit register with write enable
    reg1(we, clk, clkN, rstN, name) {
      const weN = this.not(we);
      const bTerm = this.reserveNand();
      const aTerm = this.reserveNand();
      const dIn = this.nand(aTerm.out, bTerm.out);
      const ff = this.dff(dIn, clk, clkN, rstN, name);
      this.patchNand(aTerm.id, ff.q, weN);
      return {
        q: ff.q,
        qb: ff.qb,
        connectD: (dWire) => {
          this.patchNand(bTerm.id, dWire, we);
        }
      };
    }

    // Finalize netlist + compute build report and critical-path depth
    finalize(pins, utils) {
      const numGates = this.gates.length;
      const numWires = this.numInputs + numGates;

      // Validate no unpatched gates
      for (let i = 0; i < numGates; i++) {
        const g = this.gates[i];
        if (g.a < 0 || g.b < 0 || g.a >= numWires || g.b >= numWires) {
          throw new Error('Unpatched or out-of-range gate ' + i + ' in ' + g.block);
        }
      }

      // Build flat typed arrays & fanout adjacency for fast simulation
      const gateA = new Int32Array(numGates);
      const gateB = new Int32Array(numGates);
      const gateBlockId = new Int32Array(numGates);
      const topCounts = Object.create(null);

      for (let i = 0; i < numGates; i++) {
        const g = this.gates[i];
        gateA[i] = g.a;
        gateB[i] = g.b;
        gateBlockId[i] = this.blockSet.get(g.block);
        const parts = g.block.split('/');
        const top = parts.length >= 2 ? parts[0] + '/' + parts[1] : parts[0];
        topCounts[top] = (topCounts[top] || 0) + 1;
      }

      // Compute critical-path depth (FF output or primary input -> FF D input, through combinational gates)
      const wireDepth = new Int32Array(numWires);
      wireDepth.fill(-1);
      for (let w = 0; w < this.numInputs; w++) wireDepth[w] = 0;
      for (let i = 0; i < this.flipFlops.length; i++) {
        wireDepth[this.flipFlops[i].q] = 0;
        wireDepth[this.flipFlops[i].qb] = 0;
      }

      const visiting = new Uint8Array(numWires);
      const computeDepth = (w) => {
        if (wireDepth[w] >= 0) return wireDepth[w];
        if (w < this.numInputs) return 0;
        const gId = w - this.numInputs;
        if (this.ffGateSet.has(gId)) return 0;
        if (visiting[w]) return 0; // safety guard against unexpected cycle
        visiting[w] = 1;
        const da = computeDepth(gateA[gId]);
        const db = computeDepth(gateB[gId]);
        visiting[w] = 0;
        const d = 1 + (da > db ? da : db);
        wireDepth[w] = d;
        return d;
      };

      let critDepth = 0;
      let critFF = '';
      for (let i = 0; i < this.flipFlops.length; i++) {
        const ff = this.flipFlops[i];
        const d = computeDepth(ff.d);
        if (d > critDepth) {
          critDepth = d;
          critFF = ff.block + '/' + ff.name;
        }
      }

      // Deterministic serialization for SHA-256
      const lines = new Array(numGates);
      for (let i = 0; i < numGates; i++) {
        const g = this.gates[i];
        lines[i] = g.id + ':' + g.a + ',' + g.b + '>' + g.out + '@' + g.block;
      }
      const canonical = lines.join('\n');
      const sha256 = utils ? utils.sha256(canonical) : '';

      return {
        numInputs: this.numInputs,
        numGates,
        numWires,
        inputNames: this.inputNames,
        gates: this.gates,
        gateA,
        gateB,
        gateBlockId,
        blockNames: this.blockNames,
        flipFlops: this.flipFlops,
        pins,
        report: {
          totalNands: numGates,
          topLevelCounts: topCounts,
          flipFlopCount: this.flipFlops.length,
          criticalPathDepth: critDepth,
          criticalPathTarget: critFF,
          sha256
        }
      };
    }
  }

  // Build the complete FLAPJACK 16-bit CPU netlist
  function buildCPU(utils) {
    const inputNames = ['CONST_0', 'CONST_1', 'CLK', 'RST'];
    for (let i = 0; i < 16; i++) inputNames.push('MEM_RDATA_' + i);

    const b = new CircuitBuilder(inputNames);
    const C0 = 0, C1 = 1, CLK = 2, RST = 3;
    const MEM_RDATA = [];
    for (let i = 0; i < 16; i++) MEM_RDATA.push(4 + i);
    const ZERO16 = new Array(16).fill(C0);
    const ONE16 = [C1, C0, C0, C0, C0, C0, C0, C0, C0, C0, C0, C0, C0, C0, C0, C0];

    b.pushBlock('cpu');

    // Shared clock & reset inversions
    const { clkN, rstN } = b.withBlock('clock', () => ({
      clkN: b.not(CLK),
      rstN: b.not(RST)
    }));

    // 1. Sequencer state (2-bit register: S0=00, S1=01, S2=10) + Halted flag (1-bit)
    // Reserve control inputs that depend on decoded state & IR
    const seq = b.withBlock('sequencer', () => {
      const s0Slot = b.reserveNand(); // will hold nextS0 via double-invert or direct
      const s1Slot = b.reserveNand();
      const s0Wire = b.not(s0Slot.out);
      const s1Wire = b.not(s1Slot.out);
      const ffS0 = b.dff(s0Wire, CLK, clkN, rstN, 'state_0');
      const ffS1 = b.dff(s1Wire, CLK, clkN, rstN, 'state_1');
      const haltedSlot = b.reserveNand();
      const haltedNext = b.not(haltedSlot.out);
      const ffHalted = b.dff(haltedNext, CLK, clkN, rstN, 'halted');

      const isS0 = b.and(ffS0.qb, ffS1.qb);
      const isS1 = b.and(ffS0.q, ffS1.qb);
      const isS2 = b.and(ffS0.qb, ffS1.q);
      const active = ffHalted.qb;

      return {
        s: [ffS0.q, ffS1.q],
        isS0, isS1, isS2,
        halted: ffHalted.q,
        active,
        connectNext: (ns0, ns1, nhalt) => {
          b.patchNand(s0Slot.id, ns0, C1);
          b.patchNand(s1Slot.id, ns1, C1);
          b.patchNand(haltedSlot.id, nhalt, C1);
        }
      };
    });

    // 2. Instruction Register (IR), PC, TMP, Flags (Z, N, C, V)
    // We create write-enable slots so decoder can drive them cleanly
    const irWe = b.withBlock('ir', () => b.and(seq.active, seq.isS0));
    const irReg = b.withBlock('ir', () => b.reg16(irWe, CLK, clkN, rstN, 'ir'));
    irReg.connectD(MEM_RDATA);
    const IR = irReg.q;

    // 3. Instruction Decoder (5-bit opcode IR[15:11] -> 27 one-hot lines)
    const dec = b.withBlock('decoder', () => {
      const op = [IR[11], IR[12], IR[13], IR[14], IR[15]];
      const opN = op.map(w => b.not(w));
      const isOp = new Array(27);
      for (let code = 0; code < 27; code++) {
        const terms = [];
        for (let bit = 0; bit < 5; bit++) {
          terms.push(((code >>> bit) & 1) ? op[bit] : opN[bit]);
        }
        isOp[code] = b.andN(terms);
      }
      const [
        NOP, HLT, MOV, LDI, LD, ST,
        ADD, ADC, SUB, SBC,
        AND, OR, XOR, NOT,
        SHL, SHR, SAR, CMP,
        JMP, JZ, JNZ, JN, JC,
        CALL, RET, PUSH, POP
      ] = isOp;

      const isArith = b.orN([ADD, ADC, SUB, SBC, CMP]);
      const isAluWb = b.orN([ADD, ADC, SUB, SBC, AND, OR, XOR, NOT, SHL, SHR, SAR]);
      const isStack = b.orN([PUSH, POP, CALL, RET]);
      const is3Cycle = b.orN([PUSH, POP, CALL]);
      const isBranch = b.orN([JMP, JZ, JNZ, JN, JC]);
      const isSubOp = b.orN([SUB, SBC, CMP, PUSH, CALL]);

      // ALU 3-bit output select:
      // 0: ADD/ADC/SUB/SBC/CMP/stack, 1: AND, 2: OR, 3: XOR, 4: NOT, 5: SHL, 6: SHR, 7: SAR
      const aluSel0 = b.orN([AND, XOR, SHL, SAR]);
      const aluSel1 = b.orN([OR, XOR, SHR, SAR]);
      const aluSel2 = b.orN([NOT, SHL, SHR, SAR]);

      return {
        NOP, HLT, MOV, LDI, LD, ST,
        ADD, ADC, SUB, SBC,
        AND, OR, XOR, NOT,
        SHL, SHR, SAR, CMP,
        JMP, JZ, JNZ, JN, JC,
        CALL, RET, PUSH, POP,
        isArith, isAluWb, isStack, is3Cycle, isBranch, isSubOp,
        aluSel0, aluSel1, aluSel2
      };
    });

    // 4. Flags register (Z, N, C, V)
    const flagsWe = b.withBlock('flags', () =>
      b.and(seq.active, b.and(seq.isS1, b.or(dec.isAluWb, dec.CMP)))
    );
    const flags = b.withBlock('flags', () => ({
      z: b.reg1(flagsWe, CLK, clkN, rstN, 'flag_Z'),
      n: b.reg1(flagsWe, CLK, clkN, rstN, 'flag_N'),
      c: b.reg1(flagsWe, CLK, clkN, rstN, 'flag_C'),
      v: b.reg1(flagsWe, CLK, clkN, rstN, 'flag_V')
    }));

    // 5. Branch condition & PC control
    const branchTaken = b.withBlock('control', () => b.orN([
      dec.JMP,
      b.and(dec.JZ, flags.z.q),
      b.and(dec.JNZ, flags.z.qb),
      b.and(dec.JN, flags.n.q),
      b.and(dec.JC, flags.c.q)
    ]));

    // PC register + incrementer
    const pcWe = b.withBlock('pc', () => b.and(seq.active, b.orN([
      seq.isS0,
      b.and(seq.isS1, b.orN([dec.LDI, dec.CALL, dec.RET, dec.isBranch])),
      b.and(seq.isS2, dec.CALL)
    ])));
    const pcReg = b.withBlock('pc', () => b.reg16(pcWe, CLK, clkN, rstN, 'pc'));
    const pcInc = b.withBlock('pc', () => b.withBlock('inc', () => b.inc16(pcReg.q, C1)));

    // TMP register (latches mem_rdata in S1 for POP and CALL)
    const tmpWe = b.withBlock('tmp', () =>
      b.and(seq.active, b.and(seq.isS1, b.or(dec.POP, dec.CALL)))
    );
    const tmpReg = b.withBlock('tmp', () => b.reg16(tmpWe, CLK, clkN, rstN, 'tmp'));
    tmpReg.connectD(MEM_RDATA);

    // Connect PC next mux:
    // pcLoadMem = S1 & (RET | branchTaken)
    // pcLoadTmp = S2 & CALL
    // else pcInc
    b.withBlock('pc', () => {
      const pcLoadMem = b.and(seq.isS1, b.or(dec.RET, branchTaken));
      const pcLoadTmp = b.and(seq.isS2, dec.CALL);
      const pcStep1 = b.mux2Bus(pcInc, MEM_RDATA, pcLoadMem);
      const pcNext = b.mux2Bus(pcStep1, tmpReg.q, pcLoadTmp);
      pcReg.connectD(pcNext);
    });

    // 6. Register File (R0=0, R1..R7 = 7 × 16-bit registers, 2 read ports, 1 write port)
    const regFile = b.withBlock('regfile', () => {
      // Ra_addr = 7 when stack op, else IR[7:5]
      const forceSpA = dec.isStack;
      const raAddr = [
        b.or(IR[5], forceSpA),
        b.or(IR[6], forceSpA),
        b.or(IR[7], forceSpA)
      ];
      const rbAddr = [IR[2], IR[3], IR[4]];

      // Rd_addr = 7 when S1 & stack op, else IR[10:8]
      const forceSpD = b.and(seq.isS1, dec.isStack);
      const rdAddr = [
        b.or(IR[8], forceSpD),
        b.or(IR[9], forceSpD),
        b.or(IR[10], forceSpD)
      ];

      const regWe = b.and(seq.active, b.or(
        b.and(seq.isS1, b.orN([dec.MOV, dec.LDI, dec.LD, dec.isAluWb, dec.isStack])),
        b.and(seq.isS2, dec.POP)
      ));

      // 3-to-8 write enable decoder (R1..R7 only; R0 never written)
      const rdN = rdAddr.map(w => b.not(w));
      const regs = [null]; // index 0 is R0 (hardwired zero)
      const regBuses = [ZERO16];

      for (let r = 1; r < 8; r++) {
        const selR = b.andN([
          regWe,
          (r & 1) ? rdAddr[0] : rdN[0],
          (r & 2) ? rdAddr[1] : rdN[1],
          (r & 4) ? rdAddr[2] : rdN[2]
        ]);
        const reg = b.withBlock('r' + r, () => b.reg16(selR, CLK, clkN, rstN, 'r' + r));
        regs.push(reg);
        regBuses.push(reg.q);
      }

      // Read port A (8:1 16-bit mux)
      const portA = b.withBlock('read_a', () => {
        const s0N = b.not(raAddr[0]), s1N = b.not(raAddr[1]), s2N = b.not(raAddr[2]);
        return b.mux8Bus(regBuses, raAddr[0], s0N, raAddr[1], s1N, raAddr[2], s2N);
      });

      // Read port B (8:1 16-bit mux)
      const portB = b.withBlock('read_b', () => {
        const s0N = b.not(rbAddr[0]), s1N = b.not(rbAddr[1]), s2N = b.not(rbAddr[2]);
        return b.mux8Bus(regBuses, rbAddr[0], s0N, rbAddr[1], s1N, rbAddr[2], s2N);
      });

      return { regs, regBuses, portA, portB };
    });

    // 7. 16-bit ALU
    const alu = b.withBlock('alu', () => {
      const aluA = regFile.portA;
      // Stack ops in S1 use B = 1 to compute R7 + 1 or R7 - 1
      const useOneB = b.and(seq.isS1, dec.isStack);
      const aluB = b.withBlock('b_mux', () => b.mux2Bus(regFile.portB, ONE16, useOneB));

      // Invert B for SUB/SBC/CMP/PUSH/CALL
      const bEff = b.withBlock('b_inv', () => {
        const out = new Array(16);
        for (let i = 0; i < 16; i++) out[i] = b.xor(aluB[i], dec.isSubOp);
        return out;
      });

      // Carry-in to 16-bit adder:
      // ADD / POP / RET: 0
      // ADC: C_flag
      // SUB / CMP / PUSH / CALL: 1
      // SBC: ~C_flag
      const adderCin = b.withBlock('cin', () => b.orN([
        b.and(dec.ADC, flags.c.q),
        dec.SUB, dec.CMP, dec.PUSH, dec.CALL,
        b.and(dec.SBC, flags.c.qb)
      ]));

      const adder = b.withBlock('adder', () => b.adder16(aluA, bEff, adderCin));

      const andRes = b.withBlock('and', () => aluA.map((w, i) => b.and(w, aluB[i])));
      const orRes  = b.withBlock('or',  () => aluA.map((w, i) => b.or(w, aluB[i])));
      const xorRes = b.withBlock('xor', () => aluA.map((w, i) => b.xor(w, aluB[i])));
      const notRes = b.withBlock('not', () => aluA.map(w => b.not(w)));

      // Shifts by 1 bit (pure wiring!)
      const shlRes = [C0, aluA[0], aluA[1], aluA[2], aluA[3], aluA[4], aluA[5], aluA[6],
                      aluA[7], aluA[8], aluA[9], aluA[10], aluA[11], aluA[12], aluA[13], aluA[14]];
      const shrRes = [aluA[1], aluA[2], aluA[3], aluA[4], aluA[5], aluA[6], aluA[7], aluA[8],
                      aluA[9], aluA[10], aluA[11], aluA[12], aluA[13], aluA[14], aluA[15], C0];
      const sarRes = [aluA[1], aluA[2], aluA[3], aluA[4], aluA[5], aluA[6], aluA[7], aluA[8],
                      aluA[9], aluA[10], aluA[11], aluA[12], aluA[13], aluA[14], aluA[15], aluA[15]];

      // 8:1 ALU result mux
      const res = b.withBlock('out_mux', () => {
        const s0N = b.not(dec.aluSel0), s1N = b.not(dec.aluSel1), s2N = b.not(dec.aluSel2);
        return b.mux8Bus(
          [adder.sum, andRes, orRes, xorRes, notRes, shlRes, shrRes, sarRes],
          dec.aluSel0, s0N, dec.aluSel1, s1N, dec.aluSel2, s2N
        );
      });

      // Flags computation
      const flagOut = b.withBlock('flags_logic', () => {
        const z = b.not(b.orN(res));
        const n = res[15];
        const arithC = b.xor(adder.cout, dec.isSubOp);
        const c = b.orN([
          b.and(dec.isArith, arithC),
          b.and(dec.SHL, aluA[15]),
          b.and(b.or(dec.SHR, dec.SAR), aluA[0])
        ]);
        const v = b.and(dec.isArith, b.xor(adder.c15, adder.cout));
        return { z, n, c, v };
      });

      return { res, flagOut };
    });

    // Connect flags D inputs
    flags.z.connectD(alu.flagOut.z);
    flags.n.connectD(alu.flagOut.n);
    flags.c.connectD(alu.flagOut.c);
    flags.v.connectD(alu.flagOut.v);

    // Connect Register File write-data mux:
    // 0: alu.res, 1: portA (MOV), 2: MEM_RDATA (LD/LDI), 3: tmpReg.q (S2 POP)
    b.withBlock('regfile', () => {
      b.withBlock('write_mux', () => {
        const selMov = dec.MOV;
        const selMem = b.or(dec.LD, dec.LDI);
        const selTmp = b.and(seq.isS2, dec.POP);
        const wSel0 = b.or(selMov, selTmp);
        const wSel1 = b.or(selMem, selTmp);
        const wSel0N = b.not(wSel0);
        const wSel1N = b.not(wSel1);
        const wData = b.mux4Bus(alu.res, regFile.portA, MEM_RDATA, tmpReg.q, wSel0, wSel0N, wSel1, wSel1N);
        for (let r = 1; r < 8; r++) regFile.regs[r].connectD(wData);
      });
    });

    // 8. Memory Bus Interface (Address mux, Wdata mux, RE, WE, MMIO halt detect)
    const bus = b.withBlock('bus', () => {
      const addrUsePc = b.or(
        seq.isS0,
        b.and(seq.isS1, b.orN([dec.LDI, dec.isBranch, dec.CALL]))
      );
      const memAddr = b.withBlock('addr_mux', () => b.mux2Bus(regFile.portA, pcReg.q, addrUsePc));
      const wdataUsePc = b.and(seq.isS2, dec.CALL);
      const memWdata = b.withBlock('wdata_mux', () => b.mux2Bus(regFile.portB, pcReg.q, wdataUsePc));

      const memRe = b.and(seq.active, b.or(
        seq.isS0,
        b.and(seq.isS1, b.orN([dec.LDI, dec.LD, dec.POP, dec.RET, dec.isBranch, dec.CALL]))
      ));
      const memWe = b.and(seq.active, b.or(
        b.and(seq.isS1, dec.ST),
        b.and(seq.isS2, b.or(dec.PUSH, dec.CALL))
      ));

      // Hardware decode of halt MMIO write (addr == 0xF003 && memWe)
      const isHaltAddr = b.withBlock('halt_decode', () => b.eq16Const(memAddr, 0xf003));
      const haltIo = b.and(memWe, isHaltAddr);

      return { memAddr, memWdata, memRe, memWe, haltIo };
    });

    // 9. Connect Sequencer Next State & Retire Output
    const retire = b.withBlock('sequencer', () => {
      const nextS0 = b.and(seq.active, seq.isS0); // S0 -> S1 (01), else 0
      const nextS1 = b.and(seq.active, b.and(seq.isS1, dec.is3Cycle)); // S1 -> S2 (10) if 3-cycle, else 0
      const nextHalt = b.orN([
        seq.halted,
        bus.haltIo,
        b.and(seq.active, b.and(seq.isS1, dec.HLT))
      ]);
      seq.connectNext(nextS0, nextS1, nextHalt);
      return b.and(seq.active, b.or(b.and(seq.isS1, b.not(dec.is3Cycle)), seq.isS2));
    });

    b.popBlock(); // 'cpu'

    const pins = {
      const0: C0, const1: C1, clk: CLK, rst: RST,
      memRdata: MEM_RDATA,
      memAddr: bus.memAddr,
      memWdata: bus.memWdata,
      memRe: bus.memRe,
      memWe: bus.memWe,
      retire,
      halted: seq.halted,
      pc: pcReg.q,
      ir: IR,
      state: seq.s,
      flags: { z: flags.z.q, n: flags.n.q, c: flags.c.q, v: flags.v.q },
      regs: regFile.regBuses
    };

    return b.finalize(pins, utils);
  }

  return { CircuitBuilder, buildCPU };
})();

<script id="griddle-module">
// griddle.js — Pure NAND gate-level event-driven simulator for FLAPJACK
// Strictly independent of any behavioural CPU model.
const Griddle = (() => {
  // Behavioural Memory + MMIO Bus (the one component permitted to be behavioural per SPEC §2)
  class MemoryBus {
    constructor(utils) {
      this.utils = utils;
      this.ram = new Uint16Array(0xe000);      // 0x0000-0xDFFF
      this.vram = new Uint16Array(0x0c00);     // 0xE000-0xEBFF (64x48)
      this.keys = 0;                           // 0xF000 bitmask
      this.speakerBit = 0;                     // 0xF002 bit 0
      this.speakerLog = [];                    // [{ cycle, bit }]
      this.writeHash = utils ? utils.FNV_OFFSET : 0x811c9dc5;
      this.writeCount = 0;
    }

    reset(keepProgram) {
      if (!keepProgram) this.ram.fill(0);
      this.vram.fill(0);
      this.keys = 0;
      this.speakerBit = 0;
      this.speakerLog = [];
      this.writeHash = this.utils ? this.utils.FNV_OFFSET : 0x811c9dc5;
      this.writeCount = 0;
    }

    loadProgram(words, baseAddr = 0) {
      for (let i = 0; i < words.length; i++) {
        const addr = (baseAddr + i) & 0xffff;
        if (addr < 0xe000) this.ram[addr] = words[i] & 0xffff;
        else if (addr < 0xec00) this.vram[addr - 0xe000] = words[i] & 0xffff;
      }
    }

    read(addr, cycleCount) {
      if (addr < 0xe000) return this.ram[addr];
      if (addr < 0xec00) return this.vram[addr - 0xe000];
      if (addr === 0xf000) return this.keys & 0xffff;
      if (addr === 0xf001) return cycleCount & 0xffff;
      return 0xffff;
    }

    write(addr, val, cycleCount) {
      const v = val & 0xffff;
      if (this.utils) {
        this.writeHash = this.utils.fnv1aStep(this.writeHash, addr);
        this.writeHash = this.utils.fnv1aStep(this.writeHash, v);
      }
      this.writeCount++;
      if (addr < 0xe000) {
        this.ram[addr] = v;
      } else if (addr < 0xec00) {
        this.vram[addr - 0xe000] = v;
      } else if (addr === 0xf002) {
        const bit = v & 1;
        if (bit !== this.speakerBit) {
          this.speakerBit = bit;
          this.speakerLog.push({ cycle: cycleCount, bit });
        }
      }
      // 0xF003 halt is handled by CPU hardware gates; unmapped writes ignored
    }

    videoHash() {
      return this.utils ? this.utils.fnv1aWords(this.vram, 0, 0x0c00) : 0;
    }

    snapshot() {
      return {
        ram: this.ram.slice(),
        vram: this.vram.slice(),
        keys: this.keys,
        speakerBit: this.speakerBit,
        speakerLogLen: this.speakerLog.length,
        writeHash: this.writeHash,
        writeCount: this.writeCount
      };
    }

    restore(snap) {
      this.ram.set(snap.ram);
      this.vram.set(snap.vram);
      this.keys = snap.keys;
      this.speakerBit = snap.speakerBit;
      this.speakerLog.length = snap.speakerLogLen;
      this.writeHash = snap.writeHash;
      this.writeCount = snap.writeCount;
    }
  }

  // Event-driven NAND gate simulator
  class GateSimulator {
    constructor(netlist, utils) {
      this.netlist = netlist;
      this.utils = utils;
      this.numInputs = netlist.numInputs;
      this.numGates = netlist.numGates;
      this.numWires = netlist.numWires;
      this.gateA = netlist.gateA;
      this.gateB = netlist.gateB;
      this.pins = netlist.pins;

      // Wire values (0 or 1)
      this.vals = new Uint8Array(this.numWires);
      this.toggles = new Uint32Array(this.numGates);
      this.evalCount = 0;
      this.cycles = 0;
      this.retired = 0;
      this.oscillating = false;
      this.lastOscillation = null;

      // Build CSR fanout adjacency: wire -> list of gate IDs driven by that wire
      const counts = new Int32Array(this.numWires);
      for (let g = 0; g < this.numGates; g++) {
        counts[this.gateA[g]]++;
        if (this.gateB[g] !== this.gateA[g]) counts[this.gateB[g]]++;
      }
      this.fanoutStart = new Int32Array(this.numWires + 1);
      for (let w = 0; w < this.numWires; w++) {
        this.fanoutStart[w + 1] = this.fanoutStart[w] + counts[w];
      }
      this.fanoutGates = new Int32Array(this.fanoutStart[this.numWires]);
      const cursor = this.fanoutStart.slice();
      for (let g = 0; g < this.numGates; g++) {
        const a = this.gateA[g];
        const b = this.gateB[g];
        this.fanoutGates[cursor[a]++] = g;
        if (b !== a) this.fanoutGates[cursor[b]++] = g;
      }

      // Double-buffered wave queues for unit-delay settling
      this.qCur = new Int32Array(this.numGates);
      this.qNext = new Int32Array(this.numGates);
      this.qNextLen = 0;
      this.inNext = new Uint8Array(this.numGates);

      this.bus = new MemoryBus(utils);
      this.maxPasses = 256;

      // Initial wire constants
      if (this.pins && this.pins.const1 !== undefined) {
        this.vals[this.pins.const0] = 0;
        this.vals[this.pins.const1] = 1;
      }
    }

    _enqueueWireFanout(w) {
      const start = this.fanoutStart[w];
      const end = this.fanoutStart[w + 1];
      const fg = this.fanoutGates;
      const inN = this.inNext;
      const qN = this.qNext;
      let len = this.qNextLen;
      for (let i = start; i < end; i++) {
        const g = fg[i];
        if (inN[g] === 0) {
          inN[g] = 1;
          qN[len++] = g;
        }
      }
      this.qNextLen = len;
    }

    setInput(wireId, bit) {
      const b = bit ? 1 : 0;
      if (this.vals[wireId] !== b) {
        this.vals[wireId] = b;
        this._enqueueWireFanout(wireId);
      }
    }

    enqueueAllGates() {
      for (let g = 0; g < this.numGates; g++) {
        if (this.inNext[g] === 0) {
          this.inNext[g] = 1;
          this.qNext[this.qNextLen++] = g;
        }
      }
    }

    // Pure NAND gate settling: zero arithmetic/bitwise ops on CPU data
    settle(maxPasses) {
      const limit = maxPasses || this.maxPasses;
      const vals = this.vals;
      const gA = this.gateA;
      const gB = this.gateB;
      const numIn = this.numInputs;
      const toggles = this.toggles;
      const fStart = this.fanoutStart;
      const fGates = this.fanoutGates;
      const inNext = this.inNext;

      let passes = 0;
      while (this.qNextLen > 0) {
        if (passes >= limit) {
          const osc = [];
          const cap = this.qNextLen < 16 ? this.qNextLen : 16;
          for (let i = 0; i < cap; i++) osc.push(this.qNext[i]);
          this.oscillating = true;
          this.lastOscillation = { passes, activeCount: this.qNextLen, sampleGates: osc };
          // Clear queue state
          for (let i = 0; i < this.qNextLen; i++) inNext[this.qNext[i]] = 0;
          this.qNextLen = 0;
          return { settled: false, passes, sampleGates: osc };
        }

        // Swap qNext into qCur
        const curLen = this.qNextLen;
        const tmp = this.qCur;
        this.qCur = this.qNext;
        this.qNext = tmp;
        this.qNextLen = 0;

        const qCur = this.qCur;
        const qNext = this.qNext;
        for (let i = 0; i < curLen; i++) inNext[qCur[i]] = 0;

        let nextLen = 0;
        let evals = 0;
        for (let i = 0; i < curLen; i++) {
          const g = qCur[i];
          const wOut = numIn + g;
          // Pure 2-input NAND primitive
          const nv = (vals[gA[g]] && vals[gB[g]]) ? 0 : 1;
          evals++;
          if (vals[wOut] !== nv) {
            vals[wOut] = nv;
            toggles[g]++;
            const fs = fStart[wOut];
            const fe = fStart[wOut + 1];
            for (let k = fs; k < fe; k++) {
              const fg = fGates[k];
              if (inNext[fg] === 0) {
                inNext[fg] = 1;
                qNext[nextLen++] = fg;
              }
            }
          }
        }
        this.evalCount += evals;
        this.qNextLen = nextLen;
        passes++;
      }
      this.oscillating = false;
      return { settled: true, passes };
    }

    // Memory bus boundary helpers (converting pin bit-vectors to/from behavioural MemoryBus)
    _readBusWord(wireIds) {
      const vals = this.vals;
      let word = 0;
      let weight = 1;
      for (let i = 0; i < wireIds.length; i++) {
        if (vals[wireIds[i]]) word += weight;
        weight *= 2;
      }
      return word;
    }

    _driveBusWord(wireIds, word) {
      let rem = word;
      for (let i = 0; i < wireIds.length; i++) {
        const bit = rem % 2;
        rem = (rem - bit) / 2;
        this.setInput(wireIds[i], bit);
      }
    }

    reset(keepProgram = true) {
      this.vals.fill(0);
      this.toggles.fill(0);
      this.evalCount = 0;
      this.cycles = 0;
      this.retired = 0;
      this.oscillating = false;
      this.lastOscillation = null;
      this.qNextLen = 0;
      this.inNext.fill(0);
      this.bus.reset(keepProgram);

      const p = this.pins;
      this.vals[p.const0] = 0;
      this.vals[p.const1] = 1;
      this.vals[p.clk] = 0;
      this.vals[p.rst] = 1;
      this.enqueueAllGates();
      this.settle();

      // Clock once with RST=1 to deterministically clear all master-slave flip-flops
      this.setInput(p.clk, 1);
      this.settle();
      this.setInput(p.clk, 0);
      this.settle();

      // Release RST and settle combinational logic for S0 fetch
      this.setInput(p.rst, 0);
      this.settle();

      // Reset counters after power-on reset
      this.toggles.fill(0);
      this.evalCount = 0;
    }

    // Execute one full clock cycle (memory read -> rising edge -> memory write -> falling edge)
    stepCycle() {
      const p = this.pins;
      if (this.vals[p.halted]) {
        return { halted: true, retired: false, settled: true };
      }

      // 1. Combinational memory read while CLK=0
      if (this.vals[p.memRe]) {
        const rAddr = this._readBusWord(p.memAddr);
        const rWord = this.bus.read(rAddr, this.cycles);
        this._driveBusWord(p.memRdata, rWord);
        const rSettle = this.settle();
        if (!rSettle.settled) return { halted: false, retired: false, settled: false, oscillation: rSettle };
      }

      // 2. Sample combinational retire & write intent right before rising edge
      const didRetire = this.vals[p.retire] === 1;
      const didWrite = this.vals[p.memWe] === 1;
      let wAddr = 0, wData = 0;
      if (didWrite) {
        wAddr = this._readBusWord(p.memAddr);
        wData = this._readBusWord(p.memWdata);
      }

      // 3. Rising clock edge (CLK 0 -> 1): flip-flops latch master into slave
      this.setInput(p.clk, 1);
      const sRise = this.settle();
      if (!sRise.settled) return { halted: false, retired: false, settled: false, oscillation: sRise };

      // Commit memory write on rising edge
      if (didWrite) {
        this.bus.write(wAddr, wData, this.cycles);
      }

      // 4. Falling clock edge (CLK 1 -> 0): master tracks next combinational state
      this.setInput(p.clk, 0);
      const sFall = this.settle();
      if (!sFall.settled) return { halted: false, retired: false, settled: false, oscillation: sFall };

      this.cycles++;
      if (didRetire) this.retired++;
      return {
        halted: this.vals[p.halted] === 1,
        retired: didRetire,
        settled: true
      };
    }

    // Step until one instruction retires (max 8 cycles guard)
    stepInstruction() {
      const p = this.pins;
      if (this.vals[p.halted]) return { halted: true, cycles: 0, retired: false };
      let c = 0;
      while (c < 8) {
        const res = this.stepCycle();
        c++;
        if (!res.settled) return { halted: false, cycles: c, retired: false, oscillation: res.oscillation };
        if (res.retired) return { halted: res.halted, cycles: c, retired: true };
        if (res.halted) return { halted: true, cycles: c, retired: false };
      }
      return { halted: false, cycles: c, retired: false, timeout: true };
    }

    runInstructions(n) {
      let ran = 0;
      for (let i = 0; i < n; i++) {
        const r = this.stepInstruction();
        if (r.retired) ran++;
        if (r.halted || r.oscillation || r.timeout) return { ran, halted: r.halted, oscillation: r.oscillation };
      }
      return { ran, halted: this.vals[this.pins.halted] === 1 };
    }

    runUntilHalt(maxInstructions = 1000000) {
      return this.runInstructions(maxInstructions);
    }

    // Read observable architectural state directly from gate output wires
    getState() {
      const p = this.pins;
      const regs = new Uint16Array(8);
      for (let r = 0; r < 8; r++) regs[r] = this._readBusWord(p.regs[r]);
      return {
        pc: this._readBusWord(p.pc),
        ir: this._readBusWord(p.ir),
        regs,
        flags: {
          z: this.vals[p.flags.z],
          n: this.vals[p.flags.n],
          c: this.vals[p.flags.c],
          v: this.vals[p.flags.v]
        },
        halted: this.vals[p.halted] === 1,
        cycles: this.cycles,
        retired: this.retired,
        writeHash: this.bus.writeHash,
        videoHash: this.bus.videoHash()
      };
    }

    // Aggregate toggles by hierarchical block (for Syrup power heatmap)
    getBlockToggles() {
      const blockNames = this.netlist.blockNames;
      const gateBlockId = this.netlist.gateBlockId;
      const raw = new Float64Array(blockNames.length);
      for (let g = 0; g < this.numGates; g++) {
        raw[gateBlockId[g]] += this.toggles[g];
      }
      const result = Object.create(null);
      for (let b = 0; b < blockNames.length; b++) {
        result[blockNames[b]] = raw[b];
      }
      return result;
    }

    snapshot() {
      return {
        vals: this.vals.slice(),
        cycles: this.cycles,
        retired: this.retired,
        bus: this.bus.snapshot()
      };
    }

    restore(snap) {
      this.vals.set(snap.vals);
      this.cycles = snap.cycles;
      this.retired = snap.retired;
      this.qNextLen = 0;
      this.inNext.fill(0);
      this.bus.restore(snap.bus);
    }
  }

  return { MemoryBus, GateSimulator };
})();

// pan.js — Independent behavioural instruction-level CPU twin for FLAPJACK
// Shares zero code, classes, or data structures with the gate-level netlist or simulator.
const Pan = (() => {
  const FNV_INIT = 0x811c9dc5;
  const FNV_PRIME = 0x01000193;

  function hashWord(h, w) {
    h = Math.imul((h ^ (w & 0xff)) >>> 0, FNV_PRIME) >>> 0;
    h = Math.imul((h ^ ((w >>> 8) & 0xff)) >>> 0, FNV_PRIME) >>> 0;
    return h >>> 0;
  }

  class BehaviouralCPU {
    constructor() {
      this.ram = new Uint16Array(0xe000);
      this.vram = new Uint16Array(0x0c00);
      this.r = new Uint16Array(8);
      this.pc = 0;
      this.ir = 0;
      this.z = 0;
      this.n = 0;
      this.c = 0;
      this.v = 0;
      this.halted = false;
      this.cycles = 0;
      this.retired = 0;
      this.keys = 0;
      this.speakerBit = 0;
      this.speakerLog = [];
      this.writeHash = FNV_INIT;
      this.writeCount = 0;
      this.trace = []; // Ring of last 16 retired instructions
    }

    reset(keepProgram = true) {
      if (!keepProgram) this.ram.fill(0);
      this.vram.fill(0);
      this.r.fill(0);
      this.pc = 0;
      this.ir = 0;
      this.z = 0;
      this.n = 0;
      this.c = 0;
      this.v = 0;
      this.halted = false;
      this.cycles = 0;
      this.retired = 0;
      this.keys = 0;
      this.speakerBit = 0;
      this.speakerLog = [];
      this.writeHash = FNV_INIT;
      this.writeCount = 0;
      this.trace = [];
    }

    loadProgram(words, baseAddr = 0) {
      for (let i = 0; i < words.length; i++) {
        const a = (baseAddr + i) & 0xffff;
        if (a < 0xe000) this.ram[a] = words[i] & 0xffff;
        else if (a < 0xec00) this.vram[a - 0xe000] = words[i] & 0xffff;
      }
    }

    memRead(addr, cycleAtRead) {
      const a = addr & 0xffff;
      if (a < 0xe000) return this.ram[a];
      if (a < 0xec00) return this.vram[a - 0xe000];
      if (a === 0xf000) return this.keys & 0xffff;
      if (a === 0xf001) return cycleAtRead & 0xffff;
      return 0xffff;
    }

    memWrite(addr, val, cycleAtWrite) {
      const a = addr & 0xffff;
      const v = val & 0xffff;
      this.writeHash = hashWord(hashWord(this.writeHash, a), v);
      this.writeCount++;
      if (a < 0xe000) {
        this.ram[a] = v;
      } else if (a < 0xec00) {
        this.vram[a - 0xe000] = v;
      } else if (a === 0xf002) {
        const bit = v & 1;
        if (bit !== this.speakerBit) {
          this.speakerBit = bit;
          this.speakerLog.push({ cycle: cycleAtWrite, bit });
        }
      } else if (a === 0xf003) {
        this.halted = true;
      }
    }

    setReg(idx, val) {
      if (idx !== 0) this.r[idx] = val & 0xffff;
    }

    stepInstruction() {
      if (this.halted) return { halted: true, cycles: 0, retired: false };

      const startPc = this.pc;
      const c0 = this.cycles;
      const word = this.memRead(this.pc, c0);
      this.ir = word;
      this.pc = (this.pc + 1) & 0xffff;

      const op = (word >>> 11) & 0x1f;
      const rd = (word >>> 8) & 0x7;
      const ra = (word >>> 5) & 0x7;
      const rb = (word >>> 2) & 0x7;

      const a = this.r[ra];
      const b = this.r[rb];
      let cyc = 2;

      switch (op) {
        case 0: // NOP
          break;
        case 1: // HLT
          this.halted = true;
          break;
        case 2: // MOV Rd, Ra
          this.setReg(rd, a);
          break;
        case 3: { // LDI Rd, imm16
          const imm = this.memRead(this.pc, c0 + 1);
          this.pc = (this.pc + 1) & 0xffff;
          this.setReg(rd, imm);
          break;
        }
        case 4: { // LD Rd, [Ra]
          const val = this.memRead(a, c0 + 1);
          this.setReg(rd, val);
          break;
        }
        case 5: // ST [Ra], Rb
          this.memWrite(a, b, c0 + 1);
          break;
        case 6: { // ADD Rd, Ra, Rb
          const sum = a + b;
          const res = sum & 0xffff;
          this.z = res === 0 ? 1 : 0;
          this.n = (res >>> 15) & 1;
          this.c = sum > 0xffff ? 1 : 0;
          this.v = ((~(a ^ b) & (a ^ res)) >>> 15) & 1;
          this.setReg(rd, res);
          break;
        }
        case 7: { // ADC Rd, Ra, Rb
          const sum = a + b + this.c;
          const res = sum & 0xffff;
          this.z = res === 0 ? 1 : 0;
          this.n = (res >>> 15) & 1;
          this.c = sum > 0xffff ? 1 : 0;
          this.v = ((~(a ^ b) & (a ^ res)) >>> 15) & 1;
          this.setReg(rd, res);
          break;
        }
        case 8: { // SUB Rd, Ra, Rb
          const diff = a - b;
          const res = diff & 0xffff;
          this.z = res === 0 ? 1 : 0;
          this.n = (res >>> 15) & 1;
          this.c = diff < 0 ? 1 : 0;
          this.v = (((a ^ b) & (a ^ res)) >>> 15) & 1;
          this.setReg(rd, res);
          break;
        }
        case 9: { // SBC Rd, Ra, Rb
          const diff = a - b - this.c;
          const res = diff & 0xffff;
          this.z = res === 0 ? 1 : 0;
          this.n = (res >>> 15) & 1;
          this.c = diff < 0 ? 1 : 0;
          this.v = (((a ^ b) & (a ^ res)) >>> 15) & 1;
          this.setReg(rd, res);
          break;
        }
        case 10: { // AND
          const res = (a & b) & 0xffff;
          this.z = res === 0 ? 1 : 0;
          this.n = (res >>> 15) & 1;
          this.c = 0; this.v = 0;
          this.setReg(rd, res);
          break;
        }
        case 11: { // OR
          const res = (a | b) & 0xffff;
          this.z = res === 0 ? 1 : 0;
          this.n = (res >>> 15) & 1;
          this.c = 0; this.v = 0;
          this.setReg(rd, res);
          break;
        }
        case 12: { // XOR
          const res = (a ^ b) & 0xffff;
          this.z = res === 0 ? 1 : 0;
          this.n = (res >>> 15) & 1;
          this.c = 0; this.v = 0;
          this.setReg(rd, res);
          break;
        }
        case 13: { // NOT
          const res = (~a) & 0xffff;
          this.z = res === 0 ? 1 : 0;
          this.n = (res >>> 15) & 1;
          this.c = 0; this.v = 0;
          this.setReg(rd, res);
          break;
        }
        case 14: { // SHL
          const res = (a << 1) & 0xffff;
          this.z = res === 0 ? 1 : 0;
          this.n = (res >>> 15) & 1;
          this.c = (a >>> 15) & 1;
          this.v = 0;
          this.setReg(rd, res);
          break;
        }
        case 15: { // SHR
          const res = (a >>> 1) & 0xffff;
          this.z = res === 0 ? 1 : 0;
          this.n = (res >>> 15) & 1;
          this.c = a & 1;
          this.v = 0;
          this.setReg(rd, res);
          break;
        }
        case 16: { // SAR
          const res = ((a >>> 1) | (a & 0x8000)) & 0xffff;
          this.z = res === 0 ? 1 : 0;
          this.n = (res >>> 15) & 1;
          this.c = a & 1;
          this.v = 0;
          this.setReg(rd, res);
          break;
        }
        case 17: { // CMP Ra, Rb
          const diff = a - b;
          const res = diff & 0xffff;
          this.z = res === 0 ? 1 : 0;
          this.n = (res >>> 15) & 1;
          this.c = diff < 0 ? 1 : 0;
          this.v = (((a ^ b) & (a ^ res)) >>> 15) & 1;
          break;

          const target = this.memRead(this.pc, c0 + 1);
          this.pc = target;
          break;

        case 19: { // JZ
          const target = this.memRead(this.pc, c0 + 1);
          this.pc = this.z ? target : ((this.pc + 1) & 0xffff);
          break;

        case 20: { // JNZ
          const target = this.memRead(this.pc, c0 + 1);
          this.pc = !this.z ? target : ((this.pc + 1) & 0xffff);
          break;
        }
        case 21: { // JN
          const target = this.memRead(this.pc, c0 + 1);
          this.pc = this.n ? target : ((this.pc + 1) & 0xffff);
          break;
        }
        case 22: { // JC
          const target = this.memRead(this.pc, c0 + 1);
          this.pc = this.c ? target : ((this.pc + 1) & 0xffff);
          break;
        }
        case 23: { // CALL imm16 (3 cycles)
          const target = this.memRead(this.pc, c0 + 1);
          const retAddr = (this.pc + 1) & 0xffff;
          this.r[7] = (this.r[7] - 1) & 0xffff;
          this.memWrite(this.r[7], retAddr, c0 + 2);
          this.pc = target;
          cyc = 3;
          break;
        }
        case 24: { // RET (2 cycles)
          const retAddr = this.memRead(this.r[7], c0 + 1);
          this.r[7] = (this.r[7] + 1) & 0xffff;
          this.pc = retAddr;
          break;
        }
        case 25: { // PUSH Rb (3 cycles)
          this.r[7] = (this.r[7] - 1) & 0xffff;
          const val = this.r[rb];
          this.memWrite(this.r[7], val, c0 + 2);

          break;

          const val = this.memRead(this.r[7], c0 + 1);

          break;
      }

      this.cycles += cyc;
      this.retired++;
      if (this.trace.length >= 16) this.trace.shift();
      this.trace.push({ pc: startPc, word, cycles: this.cycles, retired: this.retired });

      return { halted: this.halted, cycles: cyc, retired: true };
    }

    runInstructions(n) {
      let ran = 0;
      for (let i = 0; i < n; i++) {
        const res = this.stepInstruction();
        if (res.retired) ran++;
        if (res.halted) return { ran, halted: true };
      }
      return { ran, halted: this.halted };
    }

    runUntilHalt(maxInstructions = 1000000) {
      return this.runInstructions(maxInstructions);
    }

    videoHash() {
      let h = FNV_INIT;
      for (let i = 0; i < 0x0c00; i++) h = hashWord(h, this.vram[i]);
      return h >>> 0;
    }

    getState() {
      return {
        pc: this.pc,
        ir: this.ir,
        regs: this.r.slice(),
        flags: { z: this.z, n: this.n, c: this.c, v: this.v },
        halted: this.halted,
        cycles: this.cycles,
        retired: this.retired,
        writeHash: this.writeHash,
        videoHash: this.videoHash()
      };
    }

    snapshot() {
      return {
        ram: this.ram.slice(),
        vram: this.vram.slice(),
        r: this.r.slice(),
        pc: this.pc,
        ir: this.ir,
        z: this.z, n: this.n, c: this.c, v: this.v,
        halted: this.halted,
        cycles: this.cycles,
        retired: this.retired,
        keys: this.keys,
        speakerBit: this.speakerBit,
        speakerLogLen: this.speakerLog.length,
        writeHash: this.writeHash,
        writeCount: this.writeCount
      };
    }

    restore(s) {
      this.ram.set(s.ram);
      this.vram.set(s.vram);
      this.r.set(s.r);
      this.pc = s.pc;
      this.ir = s.ir;
      this.z = s.z; this.n = s.n; this.c = s.c; this.v = s.v;
      this.halted = s.halted;
      this.cycles = s.cycles;
      this.retired = s.retired;
      this.keys = s.keys;
      this.speakerBit = s.speakerBit;
      this.speakerLog.length = s.speakerLogLen;
      this.writeHash = s.writeHash;
      this.writeCount = s.writeCount;
    }
  }

  return { BehaviouralCPU };
})();
